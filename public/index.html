<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaleidoQuest · Every subject is a quest</title>
<meta name="description" content="KaleidoQuest：Every subject is a quest. 全班一起玩的课堂实时答题游戏。华文、数学、英文、科学都能用，AI 一键出题，学生手机扫码加入不用注册。by Vision Chinese Academy.">
<meta property="og:type" content="website"><meta property="og:title" content="KaleidoQuest · 每一门课，都是一场闯关"><meta property="og:description" content="全班一起玩的课堂答题游戏。学生扫码加入，不用注册。"><meta property="og:image" content="https://kaleido.quest/icon.svg"><meta property="og:url" content="https://kaleido.quest/"><meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0e0b26">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=20261022c">
<style>
.top{display:flex;align-items:center;gap:10px;padding:16px 24px;max-width:1200px;margin:0 auto;width:100%;position:sticky;top:0;z-index:20;background:rgba(14,11,38,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top .sp{flex:1}
.top .logo{font-size:24px}
.top .btn{font-size:15px}
.top .ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.lang{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.28)}
/* 首屏：一句话 + 两个按钮；右边是会动的卡片角色 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;max-width:1160px;margin:0 auto;padding:36px 24px 56px;overflow:visible}
.hero h1{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:clamp(44px,6.4vw,82px);line-height:1;letter-spacing:-1px;overflow-wrap:anywhere;min-width:0}
.hero h1 span{background:linear-gradient(90deg,#fbbf24,#fb7185 55%,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .zh{font-size:clamp(20px,2.4vw,26px);font-weight:900;margin-top:18px}
.hero p{font-size:17px;color:#cfc9ee;margin-top:12px;line-height:1.7;max-width:500px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.cta .btn{font-size:18px;padding:15px 26px;border-radius:14px}
.cta .ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:#f1efff}
.chips .ic{color:var(--sc)}
.stage{position:relative;aspect-ratio:1;max-width:520px;width:100%;justify-self:center;min-width:0}
.stage::before{content:"";position:absolute;inset:12%;border-radius:50%;background:conic-gradient(from 0deg,#7c3aed,#2563eb,#0891b2,#16a34a,#f59e0b,#ea580c,#db2777,#7c3aed);filter:blur(60px);opacity:.35;animation:spin 18s linear infinite}
.orbit{position:absolute;inset:0;animation:spin 60s linear infinite}
.orbit img{position:absolute;width:21%;aspect-ratio:1;border-radius:22px;box-shadow:0 12px 26px rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.85);animation:spin 60s linear infinite reverse}
.orbit img:nth-child(odd){border-color:#67e8f9}
.bob{animation:bob 3.4s ease-in-out infinite}
.center{position:absolute;left:50%;top:50%;width:42%;transform:translate(-50%,-50%);perspective:900px}
.flip{position:relative;width:100%;aspect-ratio:104/146;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.flip.turn{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:5px;background:conic-gradient(from var(--ka,0deg),#7c3aed,#2563eb,#0891b2,#16a34a,#f59e0b,#ea580c,#db2777,#7c3aed);animation:kspin 6s linear infinite;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.face.back{transform:rotateY(180deg)}
.face div{height:100%;border-radius:16px;overflow:hidden;background:#15123a;display:flex;flex-direction:column}
.face img{width:100%;aspect-ratio:1;display:block}
.face b{flex:1;display:grid;place-items:center;font-size:clamp(14px,1.8vw,19px);font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
@media (prefers-reduced-motion:reduce){.stage *,.stage::before{animation:none!important}.flip{transition:none}}
/* 怎么玩：真实画面录下来的动图 */
.how{max-width:1120px;margin:0 auto;padding:10px 24px 60px}
.sec-h{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:32px;display:flex;align-items:center;gap:10px}
.sec-sub{color:#c9c3ea;margin:6px 0 20px;line-height:1.6}
.loops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.loop{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden}
.loop .shot{aspect-ratio:16/10;background:#15123a;overflow:hidden}
.loop .shot img{width:100%;height:100%;object-fit:cover;display:block}
.loop .cap{padding:14px 16px 16px}
.loop .cap b{font-size:18px;display:flex;align-items:center;gap:8px}
.loop .cap span{display:block;color:#c9c3ea;font-size:14px;line-height:1.6;margin-top:4px}
/* 学生登录引导 */
.stu-sec{max-width:1120px;margin:0 auto;padding:10px 24px 60px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:st}
.step{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 18px 20px}
.step b{font-size:18px;display:flex;align-items:center;gap:10px}
.step b::before{counter-increment:st;content:counter(st);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#0891b2);font-family:"Fredoka",sans-serif;font-size:16px}
.step span{display:block;color:#c9c3ea;font-size:14px;line-height:1.6;margin-top:8px}
.step code{background:rgba(255,255,255,.12);border-radius:6px;padding:1px 6px;color:#fde68a;font-weight:800}
.stu-note{margin-top:16px;color:#a39dc9;font-size:14px;line-height:1.6}
.stu-note a{color:#c4b5fd;font-weight:800}
/* 游戏库 */
.gal{max-width:1120px;margin:0 auto;padding:8px 24px 56px}
.gal .ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.live{font-size:13px;font-weight:800;background:#16a34a;color:#fff;border-radius:999px;padding:3px 10px;font-family:"Noto Sans SC",sans-serif;letter-spacing:0}
.gall{border:1.5px dashed rgba(255,255,255,.3);border-radius:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:22px;color:#fff;text-decoration:none;background:rgba(255,255,255,.04);transition:background .15s,border-color .15s}
.gall:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.55)}
.gall b{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:24px;display:flex;align-items:center;gap:8px}
.gall span{color:#c9c3ea;font-size:14px;line-height:1.6}
.ready{max-width:1120px;margin:0 auto 50px;padding:28px 32px;display:flex;align-items:center;gap:28px;border-radius:26px;background:linear-gradient(120deg,rgba(124,58,237,.35),rgba(8,145,178,.25));border:1px solid rgba(255,255,255,.14)}
.ready .mascot{margin:0;flex:none}
.ready h2{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:30px}
.ready p{color:#d6d0f5;margin-top:6px;line-height:1.6}
@media (max-width:700px){.ready{flex-direction:column;text-align:center;margin:0 16px 40px;padding:24px 18px}.ready .cta{justify-content:center}}
.foot{text-align:center;padding:20px 16px 28px;font-size:13px;color:#a39dc9;border-top:1px solid rgba(255,255,255,.08)}
.foot a{color:#c4b5fd}
/* 登录弹窗 */
.auth{position:fixed;inset:0;z-index:100;background:rgba(8,6,30,.7);display:grid;place-items:center;padding:16px;animation:tin .2s}
.panel{position:relative;width:min(420px,100%);background:#fff;color:var(--ink);border-radius:22px;padding:24px;border-top:5px solid var(--brand2);box-shadow:0 30px 70px rgba(0,0,0,.5);max-height:calc(100dvh - 32px);overflow:auto}
.panel h2{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 .ic{color:var(--brand2)}
.referral-hint{padding:10px 12px;margin:-4px 0 12px;background:#fdf2f8;border:1px solid #fbcfe8;border-radius:12px;color:#9d174d;font-size:13px;line-height:1.5;font-weight:700}
.panel .x{position:absolute;top:12px;right:12px;border:0;background:#f3f0ff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:#f3f0ff;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;border-radius:9px;padding:8px;min-height:44px;font-weight:800;background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(30,27,75,.15)}
.form{display:grid;gap:10px}
.forgot{background:none;border:0;color:var(--brand2);font-weight:700;font-size:13px;cursor:pointer;justify-self:center}
.stu{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;text-align:center;color:var(--muted)}
.stu a{font-weight:800;text-decoration:none}
@media (max-width:980px){.steps{grid-template-columns:minmax(0,1fr)}.gal .ggrid,.loops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:18px;padding:28px 16px 40px;text-align:center}.hero p{margin-left:auto;margin-right:auto}.cta,.chips{justify-content:center}.stage{max-width:360px;grid-row:auto}.top{padding:12px 16px;gap:6px}.top .logo small{display:none}.how,.gal,.stu-sec{padding-left:16px;padding-right:16px}.sec-h{font-size:26px}}
#stuTop .sm{display:none}
@media (max-width:600px){#stuTop .lg{display:none}#stuTop .sm{display:inline}.stu-sec .cta .btn{flex:1 1 100%;width:100%}.gal .ggrid,.loops{grid-template-columns:minmax(0,1fr)}.top .logo span{font-size:20px}.top .btn{padding:8px 10px;font-size:13px;min-height:40px}.cta{width:100%}.cta .btn{flex:1 1 100%;width:100%}.hero h1{font-size:clamp(42px,13vw,58px)}.hero .zh{font-size:20px}.hero p{font-size:15px}.stage{max-width:310px;margin-top:2px}.ready .cta{width:auto}.ready .cta .btn{width:auto}}
@media (max-width:380px){.top{padding-left:10px;padding-right:10px;gap:4px}.top .logo{gap:0}.top .logo i{width:34px;height:34px}.top .btn{padding-left:8px;padding-right:8px;font-size:12px}.top .lang{padding-left:8px;padding-right:8px}.panel{padding:20px 16px}.hero{padding-left:12px;padding-right:12px}.chips{gap:6px}.chips span{font-size:12px;padding:5px 9px}}
@media (max-width:480px){.top .logo span{display:none}.top .lang{padding:5px 9px}.auth{place-items:start center;overflow:auto;padding-top:max(16px,env(safe-area-inset-top))}}
</style>
</head>
<body class="home">
<div class="top"><a class="logo" href="/"><i></i><span>KaleidoQuest<small>by Vision Chinese Academy</small></span></a><span class="sp"></span>
  <a class="btn go" href="/play" id="joinTop"></a><a class="btn ghost" href="/me" id="stuTop"></a><button class="btn ghost" type="button" id="loginBtn"></button><button class="lang" type="button">EN</button></div>
<section class="hero">
  <div>
    <h1>Every subject<br><span>is a quest.</span></h1>

<script>
const { t, tt, api, $ } = VA;
let tab = 'login', gallery = [], colls = [], me = null;
// 首屏转圈的角色；中间那张每隔几秒翻一次
const ORBIT = ['crown', 'owl', 'fib', 'photo', 'rocket', 'magnet', 'turtle', 'h'];
const FLIP = [['pi', '圆周率 π', 'Pi'], ['rainbow', '彩虹', 'Rainbow'], ['fossil', '化石', 'Fossil'], ['au', '金', 'Gold'], ['infinity', '无限', 'Infinity'], ['light', '光', 'Light']];
$('#orbit').innerHTML = ORBIT.map((id, i) => { const a = i / ORBIT.length * Math.PI * 2 - Math.PI / 2; return `<img src="/card-art/${id}.webp" alt="" style="left:${50 + 40 * Math.cos(a) - 10.5}%;top:${50 + 40 * Math.sin(a) - 10.5}%">`; }).join('');
let fi = 0, side = 0;
function face(el, k) { const [id, zh, en] = FLIP[k % FLIP.length]; el.querySelector('img').src = `/card-art/${id}.webp`; el.querySelector('b').textContent = tt(zh, en); }
const faces = document.querySelectorAll('#flip .face');
face(faces[0], 0); face(faces[1], 1);
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => { fi++; side ^= 1; face(faces[side], fi); $('#flip').classList.toggle('turn', !!side); setTimeout(() => face(faces[side ^ 1], fi + 1), 800); }, 2800);

const LOOPS = () => [
  ['classic', 'swords', tt('擂台抢答', 'Classic'), tt('全班同一题，大屏倒计时，越快答对分越高。揭晓时一眼看出全班哪里错。', 'Everyone answers the same question; faster right answers score more. The reveal shows what the class missed.')],
  ['treasure', 'gem', tt('夺宝模式', 'Treasure Quest'), tt('各答各的，答对开宝箱：可能翻倍、偷分、换分。复习课最热闹的玩法。', 'Everyone plays at their own pace; right answers open chests — double, steal or swap.')],
  ['cards', 'layers', tt('收集卡', 'Collectible cards'), tt('每局结束都能得卡：44 张原创插画卡，还有每个汉字的「字灵」卡。', 'Earn cards after every game: 44 original illustrated cards plus a Hanzi Spirit for every character.')]
];
function renderText() {
  $('#joinTop').innerHTML = VA.icon('gamepad-2') + ' ' + tt('加入游戏', 'Join a game');
  $('#loginBtn').textContent = tt('老师登录', 'Teacher log in');
  $('#stuTop').innerHTML = VA.icon('graduation-cap') + `<span class="lg"> ${tt('学生登录', 'Student sign-in')}</span><span class="sm"> ${tt('学生', 'Student')}</span>`;
  $('#stuTop').title = tt('学生登录', 'Student sign-in');
  $('#stuH').innerHTML = VA.icon('graduation-cap') + ' ' + tt('学生：登录后，卡和成绩都存进账号', 'Students: sign in to keep your cards and results');
  $('#stuSub').textContent = tt('不登录也能用昵称直接玩；登录以后，收集的卡和每局成绩都会保存，换手机、换平板也看得到。', 'You can always play with just a nickname. Sign in and your cards and game results are saved — on any phone or tablet.');
  $('#stuSteps').innerHTML = [
    [tt('向老师拿登录条', 'Get your sign-in slip'), tt('学生不用自己注册。老师在后台「班级」里建好班，每人会有一个<code>班级码</code>和一个 4 位<code>密码</code>。', "No sign-up needed. Your teacher creates the class and gives you a <code>class code</code> and a 4-digit <code>PIN</code>.")],
    [tt('打开 kaleido.quest/me', 'Go to kaleido.quest/me'), tt('输入班级码，点自己的名字，再输入 4 位密码。也可以直接扫登录条上的二维码。', 'Enter the class code, tap your name and type your PIN — or scan the QR code on your slip.')],
    [tt('照常玩游戏、做作业', 'Play and do homework as usual'), tt('得到的卡进「我的卡册」，每局成绩进「我的成绩」。这台设备上之前收集的卡，登录时也会一起存进账号。', 'Cards go to “My card book” and scores to “My results”. Cards already on this device move into your account when you sign in.')]
  ].map(([h, d]) => `<div class="step"><b>${h}</b><span>${d}</span></div>`).join('');
  $('#stuGo').innerHTML = VA.icon('graduation-cap') + ' ' + tt('学生登录', 'Student sign-in');
  $('#stuJoin').innerHTML = VA.icon('gamepad-2') + ' ' + tt('不登录，直接加入游戏', 'Join without signing in');
  $('#stuNote').innerHTML = tt('老师：在后台「班级」里贴上学生名单，就能一键打印登录条，还能看到每个学生的学习记录和常错的题。', "Teachers: paste your class list under “Classes” to print sign-in slips and see each student's record and often-missed questions.") + ` <a href="/guide">${tt('看上手指南', 'Teacher guide')}</a>`;
  $('#zh').textContent = tt('每一门课，都是一场闯关', 'Every lesson becomes a game');
  $('#pitch').textContent = tt('全班一起玩的课堂答题游戏。华文、数学、英文、科学都能用；AI 一键出题，学生用手机扫码加入，不用注册。', 'Live quiz games your whole class plays together — Chinese, Math, English and Science. AI writes the questions; students join by QR, no sign-up.');
  $('#signupBtn').innerHTML = VA.icon('user-plus') + ' ' + tt('老师免费注册', 'Sign up free');
  $('#tryLink').innerHTML = VA.icon('play') + ' ' + tt('免登录试玩', 'Try a game');
  $('#readyH').textContent = tt('准备好让全班一起闯关了吗？', 'Ready to turn your next lesson into a quest?');
  $('#readyP').textContent = tt('老师免费注册，10 分钟就能开出第一局。', 'Sign up free — your first game can be running in 10 minutes.');
  $('#signupBtn2').innerHTML = VA.icon('user-plus') + ' ' + (me ? tt('进入老师后台', 'Go to dashboard') : tt('老师免费注册', 'Sign up free'));
  $('#guideBtn2').innerHTML = VA.icon('circle-help') + ' ' + tt('上手指南', 'Teacher guide');
  const SC = { chinese: '#fda4af', math: '#93c5fd', english: '#c4b5fd', science: '#86efac', malay: '#fcd34d', tamil: '#fdba74' };
  $('#subjects').innerHTML = [['chinese', tt('华文', 'Chinese')], ['math', tt('数学', 'Math')], ['english', tt('英文', 'English')], ['science', tt('科学', 'Science')], ['malay', tt('马来文', 'Malay')], ['tamil', tt('淡米尔文', 'Tamil')]].map(([s, n]) => `<span style="--sc:${SC[s]}">${VA.icon(VA.SUBJECT_ICON[s])} ${n}</span>`).join('');
  $('#howH').innerHTML = VA.icon('sparkles') + ' ' + tt('课堂上是这样的', 'What it looks like in class');
  $('#howSub').textContent = tt('下面都是真实游戏画面。', 'Real game screens, recorded as they play.');
  $('#loops').innerHTML = LOOPS().map(([id, ic, h, s]) => `<div class="loop"><div class="shot"><img src="/loops/${id}.webp" alt="${h}" loading="lazy"></div><div class="cap"><b>${VA.icon(ic)} ${h}</b><span>${s}</span></div></div>`).join('');
  $('#galH').innerHTML = VA.icon('layout-grid') + ' ' + tt('游戏库：直接开玩', 'Gallery: play right now');
  $('#galSub').textContent = tt('每个学科挑一个给你先试试。学生免登录单人试玩，老师可以直接投屏全班一起玩。', 'One pick from each subject. Students try them solo, no sign-up; teachers can host one for the whole class.');
  // 节日专题：正在进行的（没有就是下一个）
  const c = colls[0];
  $('#fest').hidden = !c || !gallery.length;
  if (c && gallery.length) {
    $('#festH').innerHTML = `${VA.icon('sparkles')} ${VA.esc(tt(c.title[0], c.title[1]))} ${c.active ? `<span class="live">${tt('应节', 'In season')}</span>` : `<span class="live" style="background:#475569">${tt('即将到来', 'Coming up')}</span>`}`;
    $('#festSub').textContent = tt(`${c.desc[0]}。按节日自动更新，全年有 ${colls.length} 个专题。`, `${c.desc[1]}. Updates with the calendar — ${colls.length} festival specials a year.`);
    $('#festGrid').innerHTML = gallery.filter(g => g.collection === c.id).map(KQG.card).join('') || '';
  }
  // 每个学科挑第一个（不含节日专题），最后一格是「查看全部」
  $('#galGrid').innerHTML = gallery.length ? gallery.filter(g => !g.collection).filter((g, i, a) => a.findIndex(x => x.subject === g.subject) === i).map(KQG.card).join('') +
    `<a class="gall" href="/gallery"><b>${tt(`全部 ${gallery.length} 个游戏`, `All ${gallery.length} games`)} ${VA.icon('arrow-right')}</b><span>${tt('华文、数学、英文、科学、综合，还有节日专题。复制到自己的题包里还能改。', 'Chinese, Math, English, Science, General and festival specials. Copy any one to edit it.')}</span></a>` : '';
  // 登录弹窗
  $('#authX').innerHTML = VA.icon('x');
  $('#authBtn').textContent = t(tab);
  $('#referralHint').hidden = !(tab === 'register' && VA.attribution.ref);
  if (VA.attribution.ref) $('#referralHint').textContent = tt('你通过同事邀请而来。完成注册并开出第一局后，你和邀请人各得 5 次 AI 出题额度。', 'You were invited by a colleague. After you register and host your first game, you both get 5 AI generations.');
  $('#forgotLink').textContent = tt('忘记密码？', 'Forgot password?');
  $('#forgotLink').hidden = tab !== 'login';
  $('#forgotHint').textContent = tt('输入注册时用的邮箱，我们会发一个重设密码的链接（1 小时内有效）。', "Enter your sign-up email and we'll send a reset link (valid for 1 hour).");
  $('#fEmail').placeholder = t('email');
  $('#fBtn').textContent = tt('发送重设链接', 'Send reset link');
  $('#fBack').innerHTML = VA.icon('arrow-left') + ' ' + tt('返回登录', 'Back to log in');
  $('#stuBox').innerHTML = `${tt('我是学生：', "I'm a student: ")}<a href="/play">${tt('加入游戏', 'join a game')}</a> · <a href="/me">${tt('学生登录', 'student sign-in')}</a><br><a href="/privacy" style="font-weight:600;font-size:13px">${tt('我们如何处理资料（隐私说明）', 'How we handle data (privacy notice)')}</a>`;
  if (me) { $('#loginBtn').textContent = tt('老师后台', 'Dashboard'); $('#signupBtn').innerHTML = VA.icon('presentation') + ' ' + tt('进入老师后台', 'Go to dashboard'); }
}
Promise.all([VA.api('/api/gallery'), VA.api('/api/collections')]).then(([g, c]) => { gallery = g; colls = c; renderText(); }).catch(() => {});
$('#galGrid').onclick = KQG.onClick;
$('#festGrid').onclick = KQG.onClick;
document.addEventListener('langchange', () => { renderText(); face(faces[side], fi); });
document.addEventListener('DOMContentLoaded', renderText);

const openAuth = which => {
  if (me) { location.href = '/teacher'; return; }
  if (which === 'register') VA.track('signup_started');
  $('#auth').hidden = false;
  document.querySelector(`[data-tab=${which}]`).click();
  setTimeout(() => (which === 'register' ? $('#name') : $('#email')).focus(), 30);
};
$('#loginBtn').onclick = () => openAuth('login');
$('#signupBtn').onclick = () => openAuth('register');
$('#signupBtn2').onclick = () => openAuth('register');
$('#authX').onclick = () => { $('#auth').hidden = true; };
$('#auth').onclick = e => { if (e.target === $('#auth')) $('#auth').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#auth').hidden = true; });
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $('#name').hidden = tab !== 'register'; $('#name').required = tab === 'register';
  $('#password').autocomplete = tab === 'register' ? 'new-password' : 'current-password';
  $('#err').textContent = ''; renderText();
});
// ?signup=1 / ?login=1：从别的页面过来直接打开弹窗
const QS = new URLSearchParams(location.search);
document.addEventListener('DOMContentLoaded', () => { if (QS.get('signup')) openAuth('register'); else if (QS.get('login')) openAuth('login'); });
$('#authForm').onsubmit = async e => {
  e.preventDefault(); $('#err').textContent = '';
  try {
    await api('/api/' + tab, { method: 'POST', body: { email: $('#email').value, password: $('#password').value, name: $('#name').value, ref: VA.attribution.ref || '' } });
    if (tab === 'register') VA.track('signup_completed');
    location.href = '/teacher';
  } catch (x) { $('#err').textContent = t('err_' + x.message) !== 'err_' + x.message ? t('err_' + x.message) : t('err_generic'); }
};
const showForgot = on => { $('#forgotForm').hidden = !on; $('#authForm').hidden = on; document.querySelector('.tabs').hidden = on; if (on) { $('#fEmail').value = $('#email').value; $('#fErr').textContent = ''; $('#fEmail').focus(); } };
$('#forgotLink').onclick = () => showForgot(true);
$('#fBack').onclick = () => showForgot(false);
$('#forgotForm').onsubmit = async e => {
  e.preventDefault(); $('#fErr').textContent = ''; $('#fBtn').disabled = true;
  try {
    await api('/api/forgot', { method: 'POST', body: { email: $('#fEmail').value } });
    $('#forgotHint').innerHTML = `<b style="color:var(--ok)">${tt('如果这个邮箱注册过，重设链接已经发出，请查收（也看看垃圾邮件）。', 'If that email is registered, a reset link is on its way (check spam too).')}</b>`;
  } catch (x) {
    $('#fErr').textContent = x.message === 'too_many' ? t('err_too_many') : x.message === 'mail_off' ? tt('暂时无法发送邮件，请联系 ask@visionchinese.com', "Email isn't available right now — contact ask@visionchinese.com") : x.message === 'email' ? t('err_email') : t('err_generic');
  }
  $('#fBtn').disabled = false;
};
api('/api/me').then(d => { me = d; renderText(); }).catch(() => {});
</script>
</body>
</html>
