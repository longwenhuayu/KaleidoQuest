<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaleidoQuest · Every subject is a quest</title>
<meta name="description" content="KaleidoQuest：Every subject is a quest. 全班一起玩的课堂实时答题游戏。华文、数学、英文、科学都能用，输入本课内容一键出题。by Vision Chinese Academy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=20261020b">
<style>
.hero{display:flex;flex-direction:column;overflow-x:clip}
.hero header{display:flex;align-items:center;padding:18px 24px;max-width:1200px;margin:0 auto;width:100%}
.hero header .sp{flex:1}
.hero .logo{font-size:24px}
.hero main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:center;max-width:1120px;margin:0 auto;padding:48px 24px 64px;width:100%}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.4px;color:#e9e5ff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 14px 6px 8px;margin-bottom:18px}
.kicker i{width:18px;height:18px;border-radius:50%;background:conic-gradient(#7c3aed,#2563eb,#0891b2,#16a34a,#f59e0b,#ea580c,#db2777,#7c3aed)}
.pitch h1{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:clamp(42px,6vw,76px);line-height:1.02;letter-spacing:-1px}
.pitch h1 span{background:linear-gradient(90deg,#fbbf24,#fb7185 55%,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.pitch p{font-size:19px;color:#ddd8f5;margin-top:18px;line-height:1.6;max-width:520px}
.pitch #pitch2{font-size:16px;color:#b9b3dc;margin-top:8px}
.subjects{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.subjects span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:#f1efff}
.subjects .ic{color:var(--sc)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.cta .btn{font-size:16px;padding:13px 22px}
.cta .ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.panels{display:flex;flex-direction:column;gap:16px;position:relative;isolation:isolate}
.panels::before{content:"";position:absolute;inset:8% -6%;z-index:-1;border-radius:50%;background:conic-gradient(from 30deg,#7c3aed,#2563eb,#0891b2,#16a34a,#f59e0b,#ea580c,#db2777,#7c3aed);filter:blur(70px);opacity:.28}
.panel{background:#fff;color:var(--ink);border-radius:22px;padding:22px 24px;box-shadow:0 24px 60px rgba(5,3,30,.45)}
.panel h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 .ic{color:var(--brand2)}
#joinForm{border-top:5px solid var(--accent)}
#teacherPanel{border-top:5px solid var(--brand2)}
.pin{display:flex;gap:10px}
.pin input{flex:1;width:100%;font-size:26px;font-weight:900;letter-spacing:6px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;min-width:0;background:#faf9ff}
.pin input::placeholder{letter-spacing:2px;font-size:20px;color:#a8a3c7}
.pin input:focus{outline:none;border-color:var(--accent);background:#fff}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:#f3f0ff;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;border-radius:9px;padding:8px;font-weight:800;background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(30,27,75,.15)}
.form{display:grid;gap:10px}
.forgot{background:none;border:0;color:var(--brand2);font-weight:700;font-size:13px;cursor:pointer;justify-self:center}
/* 游戏库 */
.gal{max-width:1120px;margin:0 auto;padding:8px 24px 56px}
.gal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.gal h2{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:32px;display:flex;align-items:center;gap:10px}
.gal .sub{color:#c9c3ea;margin-top:6px;line-height:1.6}
.gal .ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.gall{border:1.5px dashed rgba(255,255,255,.3);border-radius:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:22px;color:#fff;text-decoration:none;background:rgba(255,255,255,.04);transition:background .15s,border-color .15s}
.gall:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.55)}
.gall b{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:24px;display:flex;align-items:center;gap:8px}
.gall span{color:#c9c3ea;font-size:14px;line-height:1.6}
.foot{text-align:center;padding:20px 16px 28px;font-size:13px;color:#a39dc9;border-top:1px solid rgba(255,255,255,.08)}
.foot a{color:#c4b5fd}
.lang{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.28)}
@media (max-width:980px){.gal .ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.hero main{grid-template-columns:minmax(0,1fr);gap:30px;padding:20px 16px 44px}.pitch{text-align:center}.pitch p{margin-left:auto;margin-right:auto}.subjects,.cta{justify-content:center}.kicker{margin-bottom:14px}.hero header{padding:14px 16px}.gal{padding:0 16px 44px}.gal h2{font-size:26px}}
@media (max-width:600px){.gal .ggrid{grid-template-columns:minmax(0,1fr)}.pitch p{font-size:17px}.panel{padding:20px 18px}}
</style>
</head>
<body class="home">
<div class="hero">
  <header><a class="logo" href="/"><i></i><span>KaleidoQuest<small>by Vision Chinese Academy</small></span></a><span class="sp"></span><button class="lang" type="button">EN</button></header>
  <main>
    <div class="pitch">
      <div class="kicker" id="kicker"><i></i><span></span></div>
      <h1>Every subject<br><span>is a quest.</span></h1>
      <p data-i="tagline"></p>
      <p id="pitch2" style="font-size:16px"></p>
      <div class="subjects" id="subjects"></div>
      <div class="cta"><a class="btn go" href="#gallery" id="tryLink"></a><a class="btn ghost" href="/gallery" id="galLink"></a></div>
    </div>
    <div class="panels">
      <form class="panel" id="joinForm">
        <h2><svg class="ic" aria-hidden="true"><use href="/icons.svg#gamepad-2"></use></svg> <span data-i="join_title"></span></h2>
        <div class="pin"><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" data-ip="join_pin"><button class="btn go" data-i="join_btn"></button></div>
        <a href="/cards" id="cardsLink" style="display:inline-block;margin-top:10px;font-weight:800;text-decoration:none"></a>
      </form>
      <div class="panel" id="teacherPanel">
        <h2><svg class="ic" aria-hidden="true"><use href="/icons.svg#presentation"></use></svg> <span data-i="teacher_title"></span></h2>
        <div class="tabs"><button type="button" data-tab="login" class="on" data-i="login"></button><button type="button" data-tab="register" data-i="register"></button></div>
        <form class="form" id="authForm">
          <input class="in" id="name" data-ip="your_name" autocomplete="name" hidden>
          <input class="in" id="email" type="email" data-ip="email" autocomplete="email" required>
          <input class="in" id="password" type="password" data-ip="password" autocomplete="current-password" required minlength="8">
          <div class="err" id="err"></div>
          <button class="btn main" id="authBtn" data-i="login"></button>
          <button type="button" class="forgot" id="forgotLink"></button>
        </form>
        <form class="form" id="forgotForm" hidden>
          <div class="muted" id="forgotHint" style="font-size:14px"></div>
          <input class="in" id="fEmail" type="email" autocomplete="email" required>
          <div class="err" id="fErr"></div>
          <button class="btn main" id="fBtn"></button>
          <button type="button" class="forgot" id="fBack"></button>
        </form>
      </div>
    </div>
  </main>
</div>
<section class="gal" id="gallery">
  <div class="gal-head"><div><h2 id="galH"></h2><div class="sub" id="galSub"></div></div></div>
  <div class="ggrid" id="galGrid"></div>
</section>
<div>
  <div class="foot">© Vision Chinese Academy 文心书院 · <a href="https://visionchinese.com" target="_blank" rel="noopener">visionchinese.com</a></div>
</div>
<script src="/js/common.js"></script>
<script src="/js/gallery-ui.js?v=20261020"></script>
<script>
const { t, tt, api, $ } = VA;
let tab = 'login';
function renderText() {
  $('#pitch2').textContent = tt('华文、数学、英文、科学都能用。贴上本课内容一键出题，学生用手机扫码加入，不用注册。', 'Chinese, Math, English, Science — paste your lesson, get a quiz in seconds. Students join by QR, no sign-up.');
  // 深色底上用浅一档的学科色
  const SC = { chinese: '#fda4af', math: '#93c5fd', english: '#c4b5fd', science: '#86efac', malay: '#fcd34d', tamil: '#fdba74' };
  $('#subjects').innerHTML = [['chinese', tt('华文', 'Chinese')], ['math', tt('数学', 'Math')], ['english', tt('英文', 'English')], ['science', tt('科学', 'Science')], ['malay', tt('马来文', 'Malay')], ['tamil', tt('淡米尔文', 'Tamil')]].map(([s, n]) => `<span style="--sc:${SC[s]}">${VA.icon(VA.SUBJECT_ICON[s])} ${n}</span>`).join('');
  $('#kicker span').textContent = tt('免费 · 学生免注册 · 手机扫码加入', 'Free · No student sign-up · Join by QR');
  $('#authBtn').textContent = t(tab);
  $('#cardsLink').innerHTML = VA.icon('layers') + ' ' + tt('我的卡册', 'My card book');
  $('#forgotLink').textContent = tt('忘记密码？', 'Forgot password?');
  $('#forgotLink').hidden = tab !== 'login';
  $('#forgotHint').textContent = tt('输入注册时用的邮箱，我们会发一个重设密码的链接（1 小时内有效）。', "Enter your sign-up email and we'll send a reset link (valid for 1 hour).");
  $('#fEmail').placeholder = t('email');
  $('#fBtn').textContent = tt('发送重设链接', 'Send reset link');
  $('#fBack').innerHTML = VA.icon('arrow-left') + ' ' + tt('返回登录', 'Back to log in');
  $('#tryLink').innerHTML = VA.icon('play') + ' ' + tt('免登录试玩', 'Try a game');
  $('#galLink').innerHTML = VA.icon('layout-grid') + ' ' + tt('游戏库', 'Gallery');
  $('#galH').innerHTML = VA.icon('layout-grid') + ' ' + tt('游戏库：直接开玩', 'Gallery: play right now');
  $('#galSub').textContent = tt('每个学科挑一个给你先试试。学生免登录单人试玩，老师可以直接投屏全班一起玩。', 'One pick from each subject. Students try them solo, no sign-up; teachers can host one for the whole class.');
  // 每个学科挑第一个，最后一格是「查看全部」
  $('#galGrid').innerHTML = gallery.length ? gallery.filter((g, i) => gallery.findIndex(x => x.subject === g.subject) === i).map(KQG.card).join('') +
    `<a class="gall" href="/gallery"><b>${tt(`全部 ${gallery.length} 个游戏`, `All ${gallery.length} games`)} ${VA.icon('arrow-right')}</b><span>${tt('华文、数学、英文、科学、综合，每科 5 个。复制到自己的题包里还能改。', 'Chinese, Math, English, Science and General — 5 each. Copy any one to edit it.')}</span></a>` : '';
}
let gallery = [];
VA.api('/api/gallery').then(d => { gallery = d; renderText(); }).catch(() => {});
$('#galGrid').onclick = KQG.onClick;
document.addEventListener('langchange', renderText);
document.addEventListener('DOMContentLoaded', renderText);
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $('#name').hidden = tab !== 'register'; $('#name').required = tab === 'register';
  $('#password').autocomplete = tab === 'register' ? 'new-password' : 'current-password';
  $('#err').textContent = ''; renderText();
});
// ?signup=1：从 Gallery 过来注册
if (new URLSearchParams(location.search).get('signup')) document.addEventListener('DOMContentLoaded', () => { const b = document.querySelector('[data-tab=register]'); if (b) { b.click(); $('#teacherPanel').scrollIntoView({ block: 'center' }); } });
$('#pin').oninput = e => { e.target.value = e.target.value.replace(/\D/g, ''); };
$('#joinForm').onsubmit = e => { e.preventDefault(); const p = $('#pin').value; if (p.length === 6) location.href = '/play?pin=' + p; else $('#pin').focus(); };
$('#authForm').onsubmit = async e => {
  e.preventDefault(); $('#err').textContent = '';
  try {
    await api('/api/' + tab, { method: 'POST', body: { email: $('#email').value, password: $('#password').value, name: $('#name').value } });
    location.href = '/teacher';
  } catch (x) { $('#err').textContent = t('err_' + x.message) !== 'err_' + x.message ? t('err_' + x.message) : t('err_generic'); }
};
const showForgot = on => { $('#forgotForm').hidden = !on; $('#authForm').hidden = on; document.querySelector('.tabs').hidden = on; if (on) { $('#fEmail').value = $('#email').value; $('#fErr').textContent = ''; $('#fEmail').focus(); } };
$('#forgotLink').onclick = () => showForgot(true);
$('#fBack').onclick = () => showForgot(false);
$('#forgotForm').onsubmit = async e => {
  e.preventDefault(); $('#fErr').textContent = ''; $('#fBtn').disabled = true;
  try {
    await api('/api/forgot', { method: 'POST', body: { email: $('#fEmail').value } });
    $('#forgotHint').innerHTML = `<b style="color:var(--ok)">${tt('如果这个邮箱注册过，重设链接已经发出，请查收（也看看垃圾邮件）。', 'If that email is registered, a reset link is on its way (check spam too).')}</b>`;
  } catch (x) {
    $('#fErr').textContent = x.message === 'too_many' ? t('err_too_many') : x.message === 'mail_off' ? tt('暂时无法发送邮件，请联系 ask@visionchinese.com', "Email isn't available right now — contact ask@visionchinese.com") : x.message === 'email' ? t('err_email') : t('err_generic');
  }
  $('#fBtn').disabled = false;
};
api('/api/me').then(() => { $('#teacherPanel').innerHTML = `<h2>${VA.icon('presentation')} ${t('teacher_title')}</h2><a class="btn main" href="/teacher" style="width:100%">${tt('进入老师后台', 'Go to dashboard')} ${VA.icon('arrow-right')}</a>`; }).catch(() => {});
</script>
</body>
</html>
