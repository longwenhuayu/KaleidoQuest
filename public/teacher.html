<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaleidoQuest · 老师后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=20261022a">
<style>
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-size:24px;margin-right:auto}
.ttabs{display:flex;gap:8px;margin-bottom:18px}
.ttabs button{border:0;background:transparent;font-weight:800;font-size:16px;padding:8px 4px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted)}
.ttabs button.on{color:var(--ink);border-color:var(--brand2)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.set{display:flex;flex-direction:column;gap:10px}
.set h3{font-size:17px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.set h3{align-items:center}
.set .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:16px}
.rep{display:flex;align-items:center;gap:14px;padding:14px 18px;text-decoration:none;color:inherit;margin-bottom:10px}
.rep b{font-size:16px}
.rep .sp{flex:1}
.rep:hover{border-color:var(--brand2)}
.hw{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:10px;flex-wrap:wrap}
.hw .info{flex:1;min-width:200px}
.hw .info b{font-size:16px}
.hw .info div{font-size:13px;color:var(--muted);margin-top:3px}
.st{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
.st.open{background:#dcfce7;color:#166534}.st.due,.st.closed{background:#f1f5f9;color:#475569}
.share{display:flex;gap:14px;align-items:center;margin-top:6px}
.share .qr{background:#fff;padding:6px;border:1px solid var(--line);border-radius:12px;line-height:0}
.share .qr img,.share .qr canvas{width:150px!important;height:150px!important}
.share input{flex:1;min-width:0;font-weight:700}
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:22px}
.todo{display:flex;flex-direction:column;gap:6px;position:relative}
.todo h2{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.todo .bar{height:6px;border-radius:9px;background:#ede9fe;overflow:hidden;margin-bottom:6px}.todo .bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.todo a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px}
.todo a:hover{background:#f6f4ff}
.todo a .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.todo a.done{color:var(--muted);text-decoration:line-through}.todo a.done .ck{background:var(--ok);border-color:var(--ok)}
.todo a .go{margin-left:auto;color:var(--brand2)}
.todo .hide{position:absolute;top:12px;right:12px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border-radius:16px;padding:14px;color:#fff;text-decoration:none;display:flex;flex-direction:column;gap:4px;min-height:96px;transition:transform .15s}
.tool:hover{transform:translateY(-2px)}
.tool b{font-size:15px;display:flex;align-items:center;gap:6px}
.tool span{font-size:12.5px;opacity:.9;line-height:1.45}
.referral-note{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;color:#9a3412;font-size:13px;line-height:1.5}
.referral-note b{font-size:14px;color:#7c2d12}
.referral-note .sp{flex:1}
.onboard{grid-column:1/-1;padding:20px 22px;background:linear-gradient(135deg,#fff,#f7f3ff);border:1px solid #ddd6fe;border-radius:20px;box-shadow:0 10px 28px rgba(76,29,149,.08)}
.onboard-head{display:flex;align-items:flex-start;gap:12px}.onboard-head .sp{flex:1}.onboard h2{font-size:20px}.onboard p{color:var(--muted);font-size:14px;line-height:1.55;margin-top:4px}.onboard .skip{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0}
.onboard-steps{display:flex;gap:8px;margin:16px 0 14px}.onboard-step{height:6px;flex:1;border-radius:9px;background:#e9e3ff}.onboard-step.on{background:var(--brand2)}
.onboard-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.onboard-choice{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--ink)}.onboard-choice:hover,.onboard-choice.on{border-color:var(--brand2);background:#f3f0ff;color:var(--brand2)}
.onboard-actions{display:flex;align-items:center;gap:10px;margin-top:16px}.onboard-actions .sp{flex:1}.onboard-topic{width:min(560px,100%);margin-top:12px}
@media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
.ctab{width:100%;border-collapse:collapse;font-size:14px}
.ctab th,.ctab td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.ctab th{font-size:12px;color:var(--muted);font-weight:800;background:#faf9ff}
.ctab .pin{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:2px}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="/"><i></i><span>KaleidoQuest</span></a><span class="sp"></span><a class="btn ghost sm" href="/guide" id="guideBtn"></a><span class="muted" id="who"></span><button class="lang" type="button">EN</button><button class="btn ghost sm" id="logout" data-i="logout"></button></div>
<div class="wrap">
  <div class="ttabs"><button data-v="sets" class="on" data-i="my_sets"></button><button data-v="hw" id="hwTab"></button><button data-v="reports" data-i="reports"></button><button data-v="classes" id="clsTab"></button></div>
  <div id="start"></div>
  <section id="vSets">
    <div class="head"><h1 data-i="my_sets"></h1><a class="btn ghost" href="/gallery" id="galBtn"></a><a class="btn main" href="/edit" id="newBtn">＋ <span data-i="new_set"></span></a></div>
    <div class="sets" id="sets"></div>
  </section>
  <section id="vHw" hidden>
    <div class="head"><h1 id="hwH"></h1></div>
    <div id="hws"></div>
  </section>
  <section id="vClasses" hidden></section>
  <section id="vReports" hidden>
    <div class="head"><h1 data-i="reports"></h1></div>
    <div id="reports"></div>
  </section>
</div>
<script src="/js/common.js?v=20261022b"></script>
<script src="/data/cards.js"></script>
<script src="/js/classes.js?v=20261021c"></script>
<script>
const { t, tt, api, $, esc, toast, SUBJECT_ICON } = VA;
let sets = [], reports = [], hws = [], classes = [], referral = null;
let onboardState = { step: 1, grade: '小三 / P3', subject: 'chinese', topic: '第五课生字复习' };
const when = ms => new Date(ms).toLocaleString(VA.lang === 'en' ? 'en-SG' : 'zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function renderSets() {
  $('#sets').innerHTML = sets.length ? sets.map(s => `<div class="card set" data-id="${s.id}">
    <h3>${VA.subjectIcon(s.subject)}<span>${esc(s.title)}</span></h3>
    <div class="meta"><span class="tag">${t('s_' + s.subject)}</span>${s.grade ? `<span>${esc(s.grade)}</span>` : ''}<span>${s.n} ${t('questions')}</span><span>· ${when(s.updated)}</span></div>
    <div class="acts"><button class="btn go sm" data-act="play"${s.n ? '' : ' disabled'}>${VA.icon('play')} ${t('play')}</button><button class="btn ghost sm" data-act="hw"${s.n ? '' : ' disabled'}>${VA.icon('send')} ${tt('布置作业', 'Assign')}</button><a class="btn ghost sm" href="/edit?id=${s.id}">${VA.icon('pencil')} ${t('edit')}</a><button class="btn ghost sm" data-act="copy">${VA.icon('copy')} ${t('copy')}</button><button class="btn ghost sm danger" data-act="del">${t('del')}</button></div>
  </div>`).join('') : `<div class="empty">${VA.mascot('point', 110)}${t('empty_sets')}<br><a href="/gallery" style="font-weight:800">${tt('或者先从游戏库挑一个现成的', 'Or start from a ready-made game in the Gallery')}</a></div>`;
  $('#galBtn').innerHTML = VA.icon('layout-grid') + ' ' + tt('游戏库', 'Gallery');
  $('#guideBtn').innerHTML = VA.icon('circle-help') + ' ' + tt('上手指南', 'Guide');
}
function renderReports() {
  $('#reports').innerHTML = reports.length ? reports.map(r => `<a class="card rep" href="/report?id=${r.id}"><span class="subj" style="background:#ede9fe;color:#6d28d9">${VA.icon(r.mode === 'treasure' ? 'gem' : 'swords')}</span><b>${esc(r.title)}</b><span class="sp"></span><span class="muted">${r.players} ${t('players')} · ${when(r.ended)}</span></a>`).join('') : `<div class="empty">${VA.mascot('wait', 100)}${t('empty_reports')}</div>`;
}
$('#sets').onclick = async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.set').dataset.id;
  if (b.dataset.act === 'play') return VA.pickMode(id);
  if (b.dataset.act === 'hw') return assign(sets.find(x => x.id == id));
  if (b.dataset.act === 'copy') { await api(`/api/sets/${id}/copy`, { method: 'POST' }); await load(); toast(tt('已复制', 'Duplicated')); }
  if (b.dataset.act === 'del') {
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = t('confirm_del'); setTimeout(() => { delete b.dataset.armed; b.textContent = t('del'); }, 3000); return; }
    await api(`/api/sets/${id}`, { method: 'DELETE' }); await load();
  }
};
document.querySelectorAll('.ttabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.ttabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#vSets').hidden = b.dataset.v !== 'sets'; $('#vReports').hidden = b.dataset.v !== 'reports'; $('#vHw').hidden = b.dataset.v !== 'hw'; $('#vClasses').hidden = b.dataset.v !== 'classes'; $('#start').hidden = b.dataset.v !== 'sets';
  history.replaceState(null, '', b.dataset.v === 'sets' ? '#' : '#' + b.dataset.v);
});
// ── 作业 ──
const hwLink = code => `${location.origin}/hw/${code}`;
function renderHw() {
  $('#hwTab').textContent = tt('作业', 'Homework'); $('#hwH').textContent = tt('布置的作业', 'Homework');
  const ST = { open: tt('进行中', 'Open'), due: tt('已截止', 'Past due'), closed: tt('已关闭', 'Closed') };
  $('#hws').innerHTML = hws.length ? hws.map(h => `<div class="card hw" data-id="${h.id}">
    <span class="subj" style="background:#fef3c7;color:#b45309">${VA.icon('clipboard-list')}</span>
    <div class="info"><b>${esc(h.title)}</b> <span class="st ${h.status}">${ST[h.status]}</span><div>${tt(`${h.done} 人完成`, `${h.done} done`)} · ${h.n} ${t('questions')} · ${tt('截止', 'Due')} ${when(h.due)} · <code>${h.code}</code></div></div>
    <button class="btn ghost sm" data-hw="share">${VA.icon('qr-code')} ${tt('链接 / 二维码', 'Link / QR')}</button>
    <a class="btn go sm" href="/report?hw=${h.id}">${VA.icon('chart-column')} ${tt('看成绩', 'Results')}</a>
    <button class="btn ghost sm" data-hw="close">${h.status === 'closed' ? tt('重新开放', 'Reopen') : tt('关闭', 'Close')}</button>
    <button class="btn ghost sm danger" data-hw="del">${t('del')}</button></div>`).join('')
    : `<div class="empty">${VA.mascot('think', 100)}${tt('还没有布置作业。在题包上点「布置作业」就能生成链接。', 'No homework yet. Click “Assign” on a question set to get a link.')}</div>`;
}
$('#hws').onclick = async e => {
  const b = e.target.closest('[data-hw]'); if (!b) return;
  const h = hws.find(x => x.id == b.closest('.hw').dataset.id);
  if (b.dataset.hw === 'share') return shareBox(h.title, h.code);
  if (b.dataset.hw === 'close') { await api(`/api/assignments/${h.id}/close`, { method: 'POST', body: { closed: h.status !== 'closed' } }); return load(); }
  if (b.dataset.hw === 'del') {
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = t('confirm_del'); setTimeout(() => { delete b.dataset.armed; b.textContent = t('del'); }, 3000); return; }
    await api(`/api/assignments/${h.id}`, { method: 'DELETE' }); load();
  }
};
function modal(html) { const d = document.createElement('div'); d.className = 'modepick'; d.innerHTML = `<div class="mp-box">${html}</div>`; d.onclick = e => { if (e.target === d || e.target.closest('.mp-x')) d.remove(); }; document.body.appendChild(d); return d; }
function assign(set) {
  const days = [[1, tt('明天', 'Tomorrow')], [3, tt('3 天后', 'In 3 days')], [7, tt('1 周后', 'In 1 week')], [14, tt('2 周后', 'In 2 weeks')]];
  const d = modal(`<h2>${VA.icon('send')} ${tt('布置作业', 'Assign homework')}</h2>
    <label class="field">${tt('作业名称', 'Title')}<input class="in" id="hwTitle" maxlength="80" value="${esc(set.title)}"></label>
    <div class="row"><label class="field" style="flex:1">${tt('截止', 'Due')}<select class="in" id="hwDue">${days.map(([n, l]) => `<option value="${n}"${n === 7 ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field" style="flex:1">${tt('每人可以做几次', 'Attempts')}<select class="in" id="hwTries"><option value="0">${tt('不限（取最好）', 'Unlimited (best counts)')}</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label></div>
    <div class="muted" style="font-size:13px">${tt('布置时会保存一份题目快照，之后改题包不影响这份作业。学生不用注册，填名字就能做。', 'Questions are saved as a snapshot. Students just type their name — no sign-up.')}</div>
    <div class="err" id="hwErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost sm mp-x" type="button">${tt('取消', 'Cancel')}</button><button class="btn main" id="hwGo">${tt('生成作业链接', 'Create link')}</button></div>`);
  d.querySelector('#hwGo').onclick = async () => {
    try {
      // 截止时间定在那天晚上 23:59
      const due = new Date(); due.setDate(due.getDate() + +d.querySelector('#hwDue').value); due.setHours(23, 59, 0, 0);
      const r = await api('/api/assignments', { method: 'POST', body: { setId: set.id, title: d.querySelector('#hwTitle').value, due: due.getTime(), tries: +d.querySelector('#hwTries').value } });
      d.remove(); await load(); document.querySelector('[data-v=hw]').click(); shareBox(d.querySelector('#hwTitle').value, r.code);
    } catch (x) { d.querySelector('#hwErr').textContent = t('err_generic'); }
  };
}
async function shareBox(title, code) {
  const link = hwLink(code);
  const d = modal(`<h2>${VA.icon('link')} ${esc(title)}</h2><div class="muted">${tt('把链接发到班级群，或投屏让学生扫码。', 'Share the link with your class or project the QR code.')}</div>
    <div class="share"><div class="qr" id="hwQr"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><input class="in" readonly value="${link}"><button class="btn main" id="shareBtn">${VA.icon('send')} ${tt('系统分享', 'Share')}</button><button class="btn ghost" id="copyBtn">${VA.icon('copy')} ${tt('复制链接', 'Copy link')}</button></div></div>
    <button class="btn ghost sm mp-x" type="button" style="align-self:flex-end">${tt('关闭', 'Close')}</button>`);
  d.querySelector('#shareBtn').onclick = () => VA.shareMenu({ title, text: tt(`请完成作业「${title}」，打开链接后输入名字即可开始。`, `Please complete “${title}”. Open the link and enter your name to start.`), url: link, event: 'homework_shared' });
  d.querySelector('#copyBtn').onclick = async e => { try { await navigator.clipboard.writeText(link); } catch (x) { d.querySelector('input').select(); document.execCommand('copy'); } VA.track('share_copied', { channel: 'homework' }); e.target.closest('button').innerHTML = VA.icon('check') + ' ' + tt('已复制', 'Copied'); };
  if (!window.QRCode) await new Promise(ok => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = s.onerror = ok; document.head.appendChild(s); });
  if (window.QRCode) new QRCode(d.querySelector('#hwQr'), { text: link, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
}
$('#logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); location.href = '/'; };
async function load() {
  [sets, reports, hws, classes, referral] = await Promise.all([api('/api/sets'), api('/api/games'), api('/api/assignments'), api('/api/classes'), api('/api/referral').catch(() => null)]);
  renderStart();
  renderSets(); renderReports(); renderHw();
  KQClasses.load();
}
document.addEventListener('langchange', () => { renderStart(); renderSets(); renderReports(); renderHw(); KQClasses.render(); });
// ── 开始使用：新手任务清单 + 常用功能入口 ──
function renderStart() {
  const steps = [
    [sets.length > 0, 'layers', tt('建第一个题包（或从游戏库复制一个）', 'Create your first set (or copy one from the Gallery)'), sets.length ? '/edit' : '/gallery'],
    [reports.length > 0, 'presentation', tt('投屏开第一局', 'Host your first live game'), '#play'],
    [hws.length > 0, 'send', tt('布置一次作业', 'Assign homework once'), '#assign'],
    [classes.length > 0, 'school', tt('建一个班级，学生的卡册就不会丢', 'Create a class so students keep their cards'), '#classes']
  ];
  const n = steps.filter(s => s[0]).length;
  let hidden = false; try { hidden = localStorage.getItem('kq_start_hide') === '1'; } catch (e) {}
  const firstRun = !sets.length && !hidden && (() => { try { return localStorage.getItem('kq_onboarding_done') !== '1'; } catch (e) { return true; } })();
  const onboarding = firstRun ? renderOnboarding() : '';
  const todo = n === steps.length || hidden ? '' : `<div class="card todo"><button class="hide" type="button" id="startHide">${tt('隐藏', 'Hide')}</button>
    <h2>${VA.icon('award')} ${tt(`开始使用 · 完成 ${n} / ${steps.length}`, `Get started · ${n} of ${steps.length} done`)}</h2><div class="bar"><i style="width:${n / steps.length * 100}%"></i></div>
    ${steps.map(([done, ic, label, href]) => `<a href="${href}" class="${done ? 'done' : ''}" data-step="${href}"><span class="ck">${done ? VA.icon('check') : ''}</span>${VA.icon(ic)} ${label}${done ? '' : `<span class="go">${VA.icon('arrow-right')}</span>`}</a>`).join('')}</div>`;
  const tools = [['/edit?p=ai', 'sparkles', '#7c3aed,#db2777', tt('AI 出题', 'AI questions'), tt('写个主题或贴课文，几十秒出一套题', 'A quiz from a topic or your lesson text')],
    ['/gallery', 'layout-grid', '#2563eb,#0891b2', tt('游戏库', 'Gallery'), tt('52 个现成游戏，复制来改', '52 ready-made games to copy')],
    ['#classes', 'school', '#16a34a,#0891b2', tt('班级', 'Classes'), tt('学生密码登录，卡册永久保存', 'Student PINs, saved card books')],
    ['/guide', 'circle-help', '#f59e0b,#ea580c', tt('上手指南', 'Teacher guide'), tt('10 分钟学会所有功能', 'Everything in 10 minutes')],
    ['#referral', 'send', '#db2777,#7c3aed', tt('邀请同事', 'Invite a colleague'), referral ? tt(`${referral.invited} 位已加入 · ${referral.activated} 位已开第一局 · 奖励 ${referral.bonusAi} 次 AI`, `${referral.invited} joined · ${referral.activated} hosted · ${referral.bonusAi} AI bonus`) : tt('对方开出第一局，你和对方各得 5 次 AI 出题', 'You both get 5 AI generations after their first game')]];
  const referralNote = referral && referral.invited ? `<div class="referral-note">${VA.icon('gift')}<span><b>${tt('邀请进度', 'Referral progress')}</b><br>${tt(`${referral.activated} / ${referral.invited} 位同事已完成第一局`, `${referral.activated} of ${referral.invited} colleagues hosted their first game`)}</span><span class="sp"></span><button class="btn ghost sm" type="button" id="referralQuick">${tt('继续邀请', 'Invite more')}</button></div>` : '';
  $('#start').className = todo ? 'start' : '';
  $('#start').innerHTML = onboarding + todo + `<div class="tools"${todo ? '' : ' style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:22px"'}>${tools.map(([href, ic, g, h, s]) => `<a class="tool" href="${href}" style="background:linear-gradient(135deg,${g})"><b>${VA.icon(ic)} ${h}</b><span>${s}</span></a>`).join('')}${referralNote}</div>`;
  bindOnboarding();
  const hide = $('#startHide'); if (hide) hide.onclick = () => { try { localStorage.setItem('kq_start_hide', '1'); } catch (e) {} renderStart(); };
  $('#referralQuick')?.addEventListener('click', shareReferral);
  $('#start').querySelectorAll('[href^="#"]').forEach(a => a.onclick = e => {
    e.preventDefault(); const h = a.getAttribute('href');
    if (h === '#referral') return shareReferral();
    if (h === '#classes') return document.querySelector('[data-v=classes]').click();
    // 开局 / 布置作业：没有题包就先去游戏库，有就打开第一个题包的对应操作
    if (!sets.length) { location.href = '/gallery'; return; }
    const s = sets.find(x => x.n) || sets[0];
    if (h === '#play') VA.pickMode(s.id); else assign(s);
  });
}
function renderOnboarding() {
  const s = onboardState, subjects = [['chinese', '华文', 'Chinese'], ['math', '数学', 'Math'], ['english', '英文', 'English'], ['science', '科学', 'Science']];
  const step = s.step === 1 ? `<h2>${tt('先选一个年级', 'Choose a level')}</h2><p>${tt('我们会用它帮助 AI 控制题目难度。之后仍然可以修改。', 'This helps AI set the right difficulty. You can change it later.')}</p><div class="onboard-options">${['小一 / P1', '小二 / P2', '小三 / P3', '小四 / P4', '小五 / P5', '小六 / P6'].map(x => `<button class="onboard-choice${x === s.grade ? ' on' : ''}" data-ob-grade="${esc(x)}">${x}</button>`).join('')}</div><div class="onboard-actions"><span class="sp"></span><button class="btn main" data-ob="next">${tt('下一步', 'Next')} ${VA.icon('arrow-right')}</button></div>` : s.step === 2 ? `<h2>${tt('你准备教什么？', 'What are you teaching?')}</h2><p>${tt('选择学科，AI 会自动匹配题型和语言。', 'Pick a subject and AI will match the language and question style.')}</p><div class="onboard-options">${subjects.map(([id, zh, en]) => `<button class="onboard-choice${id === s.subject ? ' on' : ''}" data-ob-subject="${id}">${VA.icon(VA.SUBJECT_ICON[id])} ${tt(zh, en)}</button>`).join('')}</div><div class="onboard-actions"><button class="btn ghost" data-ob="back">${VA.icon('arrow-left')} ${tt('上一步', 'Back')}</button><span class="sp"></span><button class="btn main" data-ob="next">${tt('下一步', 'Next')} ${VA.icon('arrow-right')}</button></div>` : `<h2>${tt('给这套题一个主题', 'Name your first quiz')}</h2><p>${tt('写一个正在教的主题，下一步会打开 AI 出题器并自动填好。', 'Enter a lesson topic. The AI editor will open with these settings filled in.')}</p><input class="in onboard-topic" id="onboardTopic" maxlength="120" value="${esc(s.topic)}" placeholder="${tt('例如：植物的部分 / 第五课生字', 'e.g. parts of a plant / past tense verbs')}"><div class="onboard-actions"><button class="btn ghost" data-ob="back">${VA.icon('arrow-left')} ${tt('上一步', 'Back')}</button><span class="sp"></span><button class="btn main" data-ob="start">${VA.icon('sparkles')} ${tt('开始生成题目', 'Start generating')}</button></div>`;
  return `<section class="onboard"><div class="onboard-head"><div><h2>${VA.icon('sparkles')} ${tt('3 步开出第一局', 'Your first game in 3 steps')}</h2><p>${tt('不用从空白开始，先让 AI 帮你搭好第一套题。', 'Start with an AI-assisted quiz instead of a blank page.')}</p></div><span class="sp"></span><button class="skip" data-ob="skip">${tt('跳过引导', 'Skip guide')}</button></div><div class="onboard-steps">${[1, 2, 3].map(i => `<i class="onboard-step${i <= s.step ? ' on' : ''}"></i>`).join('')}</div>${step}</section>`;
}
function bindOnboarding() {
  const root = $('#start'); if (!root.querySelector('.onboard')) return;
  root.querySelectorAll('[data-ob-grade]').forEach(b => b.onclick = () => { onboardState.grade = b.dataset.obGrade; renderStart(); });
  root.querySelectorAll('[data-ob-subject]').forEach(b => b.onclick = () => { onboardState.subject = b.dataset.obSubject; renderStart(); });
  root.querySelector('[data-ob="next"]')?.addEventListener('click', () => { onboardState.topic = $('#onboardTopic')?.value?.trim() || onboardState.topic; onboardState.step++; renderStart(); });
  root.querySelector('[data-ob="back"]')?.addEventListener('click', () => { onboardState.topic = $('#onboardTopic')?.value?.trim() || onboardState.topic; onboardState.step--; renderStart(); });
  root.querySelector('#onboardTopic')?.addEventListener('input', e => { onboardState.topic = e.target.value; });
  root.querySelector('[data-ob="skip"]')?.addEventListener('click', () => { try { localStorage.setItem('kq_onboarding_done', '1'); } catch (e) {} VA.track('onboarding_skipped'); renderStart(); });
  root.querySelector('[data-ob="start"]')?.addEventListener('click', () => { onboardState.topic = $('#onboardTopic').value.trim() || onboardState.topic; try { localStorage.setItem('kq_onboarding_done', '1'); } catch (e) {} VA.track('onboarding_completed', { subject: onboardState.subject }); location.href = `/edit?p=ai&subject=${encodeURIComponent(onboardState.subject)}&grade=${encodeURIComponent(onboardState.grade)}&topic=${encodeURIComponent(onboardState.topic)}`; });
}
async function shareReferral() {
  try {
    const r = await api('/api/referral');
    VA.shareMenu({ title: tt('邀请老师使用 KaleidoQuest', 'Invite a teacher to KaleidoQuest'), text: tt('我在用 KaleidoQuest 做课堂游戏。你注册后开出第一局，我们各得 5 次 AI 出题额度。', 'I use KaleidoQuest for classroom games. Register and host your first game — we both get 5 AI generations.'), url: r.url, event: 'referral_shared' });
  } catch (e) { toast(t('err_generic')); }
}
api('/api/me').then(me => { $('#who').textContent = me.name; if (me.isAdmin) $('#who').insertAdjacentHTML('beforebegin', `<a class="btn ghost sm" href="/admin">${VA.icon('shield')} ${tt('管理后台', 'Admin')}</a>`); load(); if (['#reports', '#hw', '#classes'].includes(location.hash)) document.querySelector(`[data-v=${location.hash.slice(1)}]`).click(); }).catch(() => { location.href = '/'; });
</script>
