<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1b4b">
<meta property="og:type" content="website"><meta property="og:title" content="KaleidoQuest · 复制这套游戏"><meta property="og:description" content="先试玩，再复制到自己的课堂里修改。"><meta property="og:image" content="https://kaleido.quest/icon.svg"><meta name="twitter:card" content="summary">
<title>KaleidoQuest · 复制这套游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=20261022a">
<style>
body{min-height:100vh}.copy-top{display:flex;align-items:center;gap:12px;padding:14px 20px}.copy-top .sp{flex:1}.copy-wrap{max-width:920px;margin:0 auto;padding:32px 18px 64px}.copy-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:30px;align-items:center}.copy-cover{border-radius:24px;overflow:hidden;background:#15123a;box-shadow:0 20px 50px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16)}.copy-cover img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.copy-copy h1{font-family:"Fredoka","Noto Sans SC",sans-serif;font-size:clamp(34px,5vw,58px);line-height:1.05;overflow-wrap:anywhere}.copy-copy p{color:#c9c3ea;line-height:1.7;margin-top:14px}.copy-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.copy-meta span{padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:800}.copy-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.copy-actions .btn{flex:1}.copy-note{margin-top:22px;color:#a39dc9;font-size:13px;line-height:1.6}.copy-loading{text-align:center;padding:80px 20px}.copy-error{max-width:460px;margin:40px auto;text-align:center}.copy-error h1{font-size:28px}.copy-error p{color:#c9c3ea;margin:10px 0 20px}
@media(max-width:700px){.copy-top{padding:10px 12px}.copy-wrap{padding:20px 14px 48px}.copy-card{grid-template-columns:1fr;gap:22px}.copy-cover{order:2}.copy-copy{order:1}.copy-actions{flex-direction:column}.copy-actions .btn{width:100%}}
</style>
</head>
<body class="home">
<header class="copy-top"><a class="logo" href="/"><i></i><span>KaleidoQuest</span></a><span class="sp"></span><a class="btn ghost sm" href="/gallery" id="galleryLink"></a><button class="lang" type="button">EN</button></header>
<main class="copy-wrap" id="root"><div class="copy-loading">…</div></main>
<script src="/js/common.js?v=20261022b"></script>
<script>
const { tt, $, esc, icon, api } = VA;
const id = location.pathname.split('/').filter(Boolean).pop();
function render(g) {
  const name = tt(g.title[0], g.title[1]), desc = tt(g.desc[0], g.desc[1]), grade = tt(g.grade[0], g.grade[1]);
  VA.track('copy_landing_view', { game: g.id });
  document.title = `${name} · KaleidoQuest`;
  $('#root').innerHTML = `<div class="copy-card"><figure class="copy-cover"><img src="/gallery-covers/${esc(g.id)}.webp?v=20261022b" alt="${esc(name)}" onerror="this.src='/icon.svg'"></figure><section class="copy-copy"><div class="tag">${tt('游戏库 · 可复制', 'Gallery · Copyable')}</div><h1>${esc(name)}</h1><p>${esc(desc)}</p><div class="copy-meta"><span>${esc(grade)}</span><span>${g.n} ${tt('道题', 'questions')}</span><span>${tt('学生免登录试玩', 'No student sign-up')}</span></div><div class="copy-actions"><a class="btn go" href="/try/${esc(g.id)}">${icon('play')} ${tt('先试玩', 'Try it first')}</a><button class="btn main" id="copyGame">${icon('copy')} ${tt('复制来改', 'Copy & edit')}</button><button class="btn ghost" id="shareGame">${icon('send')} ${tt('分享给同事', 'Share')}</button></div><p class="copy-note">${tt('复制后会放进你的老师后台，可以改题目、换语言，再投屏给全班玩。', 'Copy it into your teacher dashboard, edit the questions, then host it for your class.')}</p></section></div>`;
  $('#galleryLink').textContent = tt('游戏库', 'Gallery');
  $('#copyGame').onclick = async () => { VA.track('copy_started', { game: g.id }); $('#copyGame').disabled = true; try { const r = await api(`/api/gallery/${encodeURIComponent(g.id)}/copy`, { method: 'POST' }); VA.track('copy_completed', { game: g.id }); location.href = `/edit?id=${r.id}`; } catch (e) { location.href = `/?signup=1&from=copy&game=${encodeURIComponent(g.id)}`; } };
  $('#shareGame').onclick = () => VA.shareMenu({ title: name, text: tt(`这套「${name}」可以直接试玩，也可以复制后改成自己的课堂游戏。`, `Try “${name}”, then copy it to make your own classroom game.`), url: location.href, event: 'gallery_shared' });
  document.querySelector('.copy-actions .go').onclick = () => VA.track('copy_try_clicked', { game: g.id });
}
VA.api('/api/gallery').then(list => { const g = list.find(x => x.id === id); if (g) render(g); else $('#root').innerHTML = `<div class="copy-error"><h1>${tt('找不到这套游戏', 'Game not found')}</h1><p>${tt('回到游戏库挑另一套试试。', 'Return to the Gallery and choose another game.')}</p><a class="btn go" href="/gallery">${tt('打开游戏库', 'Open Gallery')}</a></div>`; }).catch(() => { $('#root').innerHTML = `<div class="copy-error"><h1>${tt('暂时加载失败', 'Could not load this game')}</h1><a class="btn go" href="/gallery">${tt('回到游戏库', 'Back to Gallery')}</a></div>`; });
</script>
</body>
</html>
