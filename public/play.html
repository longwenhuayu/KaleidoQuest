<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e1b4b">
<title>Vision Arena · 加入游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overscroll-behavior:none}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:800;white-space:nowrap}
#gameTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.top .sp{flex:1 0 0}
.top .me{display:flex;align-items:center;gap:6px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;flex:none;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px 4px 6px}
.top .me span{font-size:22px}
.top .score{font-family:"Fredoka",sans-serif;font-size:20px}
.view{flex:1;display:none;flex-direction:column;padding:14px;gap:12px;min-height:0}
.view.on{display:flex}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.joinbox{width:min(380px,100%);background:#fff;color:var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.joinbox input{font-size:24px;font-weight:900;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px}
.joinbox input:focus{outline:none;border-color:var(--accent)}
.joinbox input#pinIn{letter-spacing:6px}
.big-av{font-size:96px;line-height:1;animation:bob 1.4s infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
.h{font-size:26px;font-weight:900}
.sub{opacity:.8;font-size:16px}
.qhead{display:flex;align-items:center;gap:10px;font-weight:800}
.tbar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.qtext{background:#fff;color:var(--ink);border-radius:16px;padding:12px 16px;font-size:20px;font-weight:800;text-align:center}
.qimg{max-height:24vh;max-width:100%;border-radius:12px;align-self:center;background:#fff}
.choices{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.choices.one{grid-template-columns:1fr}
.choice{border:0;border-radius:18px;color:#fff;font-size:22px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer;min-height:70px;word-break:break-word}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.choice .shape{font-size:32px}
.typebox{display:flex;flex-direction:column;gap:10px}
.typebox input{font-size:24px;font-weight:800;padding:14px;border-radius:14px;border:0;text-align:center}
.ord-pick{display:flex;flex-direction:column;gap:8px}
.ord-pick button{border:0;border-radius:14px;padding:14px;font-size:20px;font-weight:800;background:#fff;color:var(--ink);cursor:pointer}
.ord-pick button.used{opacity:.25}
.ord-seq{min-height:56px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ord-seq span{background:var(--accent);color:#3b2603;border-radius:10px;padding:6px 10px;font-weight:900}
.res{font-size:84px;line-height:1;animation:pop .4s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.res-ok{background:radial-gradient(circle at 50% 30%,#22c55e,#14532d)}
.res-bad{background:radial-gradient(circle at 50% 30%,#ef4444,#7f1d1d)}
.pts{font-family:"Fredoka",sans-serif;font-size:40px}
.rankline{background:rgba(255,255,255,.16);border-radius:999px;padding:8px 18px;font-weight:800}
.spinner{width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.medal{font-size:110px;line-height:1}
.err{color:#fecaca}
</style>
</head>
<body class="night">
<div class="top"><span class="logo"><i>⚡</i></span><span id="gameTitle"></span><span class="sp"></span><span class="me" id="me" hidden><span id="meAv"></span><b id="meName"></b></span><span class="score" id="meScore"></span><button class="lang" type="button" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)">EN</button></div>

<div class="view on" id="vJoin"><div class="mid">
  <div class="logo" style="font-size:30px"><i>⚡</i><span>Vision Arena</span></div>
  <form class="joinbox" id="joinForm">
    <input id="pinIn" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">
    <input id="nameIn" maxlength="16" autocomplete="nickname">
    <div class="err" id="joinErr" style="color:var(--bad)"></div>
    <button class="btn go" id="joinBtn" style="font-size:20px"></button>
  </form>
</div></div>

<div class="view" id="vWait"><div class="mid"><div class="big-av" id="waitAv"></div><div class="h" id="waitName"></div><div class="sub" id="waitMsg"></div></div></div>
<div class="view" id="vReady"><div class="mid"><div class="h" id="readyN"></div><div class="spinner"></div></div></div>
<div class="view" id="vQ">
  <div class="qhead"><span id="qN"></span><div class="tbar"><i id="tbar"></i></div></div>
  <div class="qtext" id="qText"></div>
  <div id="qImg"></div>
  <div id="qAns" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>
<div class="view" id="vSent"><div class="mid"><div class="spinner"></div><div class="h" id="sentMsg"></div><div class="sub" id="sentSub"></div></div></div>
<div class="view" id="vRes"><div class="mid"><div class="res" id="resIcon"></div><div class="h" id="resText"></div><div class="pts" id="resPts"></div><div class="sub" id="resAns"></div><div class="rankline" id="resRank"></div></div></div>
<div class="view" id="vEnd"><div class="mid"><div class="medal" id="endMedal"></div><div class="h" id="endRank"></div><div class="pts" id="endScore"></div><div class="sub" id="endStats"></div><a class="btn ghost" href="/play" id="endAgain" style="margin-top:10px"></a></div></div>
<div class="view" id="vMsg"><div class="mid"><div class="h" id="msgText"></div><a class="btn go" href="/play" id="msgBtn"></a></div></div>

<script src="/js/common.js"></script>
<script>
const { tt, $, esc, SHAPES, sfx } = VA;
const qp = new URLSearchParams(location.search);
let ws = null, me = null, pin = qp.get('pin') || '', cur = null, tEnd = 0, raf = 0, retry = 0, wakeLock = null, endState = false;
const SAVE = 'va_play';
const saved = () => { try { return JSON.parse(sessionStorage.getItem(SAVE)); } catch (e) { return null; } };

function view(id) { document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id)); document.body.className = 'night'; }
function renderStatic() {
  $('#nameIn').placeholder = tt('你的昵称', 'Nickname');
  $('#joinBtn').textContent = tt('加入 ▶', 'Join ▶');
  $('#endAgain').textContent = tt('加入下一局', 'Join another game');
  $('#msgBtn').textContent = tt('重新加入', 'Join again');
}
document.addEventListener('langchange', renderStatic); renderStatic();
$('#pinIn').value = pin; if (pin) setTimeout(() => $('#nameIn').focus(), 100);
$('#pinIn').oninput = e => { e.target.value = e.target.value.replace(/\D/g, ''); };

function connect(first) {
  ws = new WebSocket(VA.wsUrl());
  ws.onopen = () => { retry = 0; if (first) ws.send(JSON.stringify(first)); else if (me) ws.send(JSON.stringify({ t: 'rejoin', pin, token: me.token })); };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (endState || !me) return; setTimeout(() => connect(), Math.min(4000, 600 * ++retry)); };
}
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

$('#joinForm').onsubmit = e => {
  e.preventDefault();
  pin = $('#pinIn').value.trim(); const name = $('#nameIn').value.trim();
  if (pin.length !== 6) { $('#joinErr').textContent = tt('请输入 6 位房间码', 'Enter the 6-digit PIN'); return; }
  if (!name) { $('#joinErr').textContent = tt('请输入昵称', 'Enter a nickname'); return; }
  $('#joinBtn').disabled = true; $('#joinErr').textContent = '';
  connect({ t: 'join', pin, name });
};

function handle(m) {
  if (m.t === 'error') {
    if (m.error === 'rejoin_failed' || (m.error === 'room_not_found' && me)) { sessionStorage.removeItem(SAVE); me = null; endState = true; return msg(tt('这局游戏已经结束或不存在了', 'This game has ended')); }
    $('#joinBtn').disabled = false;
    $('#joinErr').textContent = { room_not_found: tt('找不到这个房间，请检查房间码', 'Game not found — check the PIN'), locked: tt('房间已锁定，请让老师解锁', 'This game is locked'), full: tt('房间满了', 'This game is full'), name: tt('请输入昵称', 'Enter a nickname') }[m.error] || tt('出错了，请再试一次', 'Something went wrong');
    try { ws.close(); } catch (e) {}
    return;
  }
  if (m.t === 'joined') {
    me = m; sessionStorage.setItem(SAVE, JSON.stringify({ pin: m.pin, token: m.token }));
    history.replaceState(null, '', '/play?pin=' + m.pin);
    $('#me').hidden = false; $('#meAv').textContent = m.avatar; $('#meName').textContent = m.name; $('#gameTitle').textContent = m.title; score(m.score);
    keepAwake();
    return;
  }
  if (m.t === 'wait') { view('vWait'); $('#waitAv').textContent = me.avatar; $('#waitName').textContent = me.name; $('#waitMsg').textContent = tt('你已加入！看大屏，等老师开始', "You're in! Watch the big screen"); return; }
  if (m.t === 'get_ready') { view('vReady'); $('#readyN').textContent = tt(`第 ${m.qi + 1} / ${m.total} 题`, `Question ${m.qi + 1} / ${m.total}`); return; }
  if (m.t === 'q') return question(m);
  if (m.t === 'answered') return sent();
  if (m.t === 'result') return result(m);
  if (m.t === 'between') { score(m.score); view('vSent'); $('#sentMsg').textContent = tt(`第 ${m.rank} 名`, `Rank ${m.rank}`); $('#sentSub').textContent = tt('看大屏，等下一题', 'Watch the big screen'); return; }
  if (m.t === 'end') return end(m);
  if (m.t === 'kicked') { endState = true; sessionStorage.removeItem(SAVE); msg(tt('你被老师移出了这局游戏', 'You were removed from the game')); }
}
function score(s) { $('#meScore').textContent = s ? s : ''; }
function msg(text) { view('vMsg'); $('#msgText').textContent = text; }

function question(m) {
  cur = m; cancelAnimationFrame(raf);
  if (m.answered) return sent();
  view('vQ');
  const q = m.q;
  $('#qN').textContent = `${m.qi + 1}/${m.total}`;
  $('#qText').textContent = q.prompt || tt('🔊 听大屏朗读，选出答案', '🔊 Listen to the big screen');
  $('#qImg').innerHTML = q.image ? `<img class="qimg" src="${esc(q.image)}" alt="">` : '';
  const box = $('#qAns');
  if (q.type === 'mcq') {
    const long = q.options.some(o => [...o].length > 14);
    box.innerHTML = `<div class="choices${long ? ' one' : ''}">${q.options.map((o, i) => `<button class="choice opt${i}" data-v="${i}"><span class="shape">${SHAPES[i]}</span>${esc(o)}</button>`).join('')}</div>`;
    box.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.v));
  } else if (q.type === 'tf') {
    box.innerHTML = `<div class="choices"><button class="choice opt1" data-v="1"><span class="shape">${SHAPES[1]}</span>✔ ${tt('对', 'True')}</button><button class="choice opt0" data-v="0"><span class="shape">${SHAPES[0]}</span>✘ ${tt('错', 'False')}</button></div>`;
    box.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(b.dataset.v === '1'));
  } else if (q.type === 'input') {
    box.innerHTML = `<form class="typebox"><input id="typeIn" maxlength="80" autocomplete="off" autocapitalize="off" placeholder="${tt('输入答案', 'Your answer')}"><button class="btn go" style="font-size:20px">${tt('提交', 'Submit')}</button></form>`;
    const f = box.querySelector('form'); f.onsubmit = e => { e.preventDefault(); const v = $('#typeIn').value.trim(); if (v) answer(v); };
    setTimeout(() => $('#typeIn').focus(), 50);
  } else {
    const seq = [];
    box.innerHTML = `<div class="sub" style="margin-bottom:6px">${tt('按正确顺序依次点：', 'Tap in the correct order:')}</div><div class="ord-seq" id="seq"></div><div class="ord-pick" style="margin-top:10px">${q.items.map(x => `<button data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn ghost" id="undo">↶ ${tt('撤销', 'Undo')}</button><button class="btn go" id="ordGo" style="flex:1" disabled>${tt('提交', 'Submit')}</button></div>`;
    const draw = () => { $('#seq').innerHTML = seq.map(i => `<span>${esc(q.items.find(x => x.i === i).text)}</span>`).join(''); box.querySelectorAll('.ord-pick button').forEach(b => b.classList.toggle('used', seq.includes(+b.dataset.i))); $('#ordGo').disabled = seq.length !== q.items.length; };
    box.querySelectorAll('.ord-pick button').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (!seq.includes(i)) { seq.push(i); draw(); } });
    $('#undo').onclick = () => { seq.pop(); draw(); };
    $('#ordGo').onclick = () => answer([...seq]);
  }
  tEnd = performance.now() + m.left; const total = q.time * 1000;
  const tick = () => { const left = Math.max(0, tEnd - performance.now()); $('#tbar').style.width = `${left / total * 100}%`; if (left > 0) raf = requestAnimationFrame(tick); else if (document.querySelector('#vQ.on')) sent(true); };
  tick();
}
function answer(ans) { if (!cur) return; send({ t: 'answer', qi: cur.qi, ans }); sent(); if (navigator.vibrate) navigator.vibrate(30); }
function sent(timeout) { cancelAnimationFrame(raf); view('vSent'); $('#sentMsg').textContent = timeout ? tt('⏰ 时间到！', "⏰ Time's up!") : tt('已提交！', 'Answer sent!'); $('#sentSub').textContent = tt('看看大屏…', 'Watch the big screen…'); }
function result(m) {
  view('vRes'); score(m.score);
  document.body.className = 'night ' + (m.correct ? 'res-ok' : 'res-bad');
  $('#resIcon').textContent = m.correct ? '✅' : m.answered ? '❌' : '⏰';
  $('#resText').textContent = m.correct ? (m.streak >= 3 ? tt(`连对 ${m.streak} 题！🔥`, `${m.streak} in a row! 🔥`) : tt('答对了！', 'Correct!')) : m.answered ? tt('答错了', 'Not quite') : tt('没来得及作答', 'No answer');
  $('#resPts').textContent = m.correct ? `+${m.points}` : '';
  $('#resAns').textContent = m.correct ? '' : tt(`正确答案：${m.answerText}`, `Answer: ${m.answerText}`);
  $('#resRank').textContent = tt(`第 ${m.rank} / ${m.of} 名`, `Rank ${m.rank} of ${m.of}`);
  m.correct ? sfx.ok() : sfx.bad();
}
function end(m) {
  endState = true; sessionStorage.removeItem(SAVE); view('vEnd'); score(m.score);
  $('#endMedal').textContent = ['🥇', '🥈', '🥉'][m.rank - 1] || '🎉';
  $('#endRank').textContent = tt(`第 ${m.rank} 名（共 ${m.of} 人）`, `Rank ${m.rank} of ${m.of}`);
  $('#endScore').textContent = m.score;
  $('#endStats').textContent = tt(`答对 ${m.correct} / ${m.total} 题 · 最多连对 ${m.best} 题`, `${m.correct} / ${m.total} correct · best streak ${m.best}`);
  if (m.rank <= 3) sfx.fanfare();
}
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me && !endState) { keepAwake(); if (!ws || ws.readyState > 1) connect(); } });

// 刷新页面或断线后，用保存的令牌重新加入同一局
const s = saved();
if (s && (!pin || s.pin === pin)) { pin = s.pin; me = { token: s.token, avatar: '', name: '' }; connect(); }
</script>
</body>
</html>
