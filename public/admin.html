<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KaleidoQuest · 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=20261022c">
<style>
.ttabs{display:flex;gap:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.ttabs button{border:0;background:none;font-weight:800;font-size:16px;padding:10px 2px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.ttabs button.on{color:var(--ink);border-color:var(--brand2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:14px 16px}
.tile b{display:block;font-family:"Fredoka",sans-serif;font-size:30px;color:var(--ink)}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.tile small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart h3{font-size:15px;margin-bottom:2px}
.chart .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--brand2);pointer-events:none}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart .bar.hl{fill:#5b21b6}
.chart .grid line{stroke:#ece9f8}
.chart .ax{font-size:10px;fill:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;z-index:50;white-space:nowrap}
details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:800;background:#faf9ff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf8ff}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.badge.ok{background:#dcfce7;color:#166534}.badge.off{background:#fee2e2;color:#991b1b}.badge.adm{background:#ede9fe;color:#5b21b6}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px}
.drawer{position:fixed;inset:0;z-index:100;background:rgba(30,27,75,.4);display:flex;justify-content:flex-end}
.drawer .panel{width:min(620px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px;animation:slidein .2s}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.drawer h2{font-size:22px}
.drawer h3{font-size:15px;margin:18px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:14px}
.li .sp{flex:1}
.li a,.li button{font-size:12px}
.qv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.qv small{color:var(--muted)}
.search{max-width:360px;margin-bottom:12px}
.user-edit{display:grid;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}.user-edit h3{margin:0 0 2px}.user-edit .row{align-items:end}.user-edit .field{flex:1;min-width:180px}.user-edit .btn{align-self:end}
.growth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.growth-panel{min-width:0}.growth-panel h3{margin-bottom:4px}.growth-panel .sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.admin-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;padding:6px 0 2px}.eyebrow{display:block;color:var(--brand2);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}.admin-intro h1{font-family:"Fredoka",sans-serif;font-size:clamp(28px,4vw,40px);line-height:1.05}.admin-intro p{color:var(--muted);font-size:14px;margin-top:7px;line-height:1.5}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-actions .btn{white-space:nowrap}.ttabs{position:sticky;top:0;z-index:10;background:rgba(245,243,255,.92);backdrop-filter:blur(10px);padding-top:2px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head h2{font-size:22px}.section-head p{font-size:13px;color:var(--muted);margin-top:4px}.search-wrap{width:min(360px,100%);position:relative}.search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.search-wrap .in{padding-left:36px;width:100%;margin:0}
.growth-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}.growth-toolbar h2{font-size:22px}.growth-toolbar p{font-size:13px;color:var(--muted);margin-top:4px}.growth-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.growth-controls .in{width:auto;min-width:116px;margin:0}.teacher-cards{display:none}.teacher-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 16px rgba(30,27,75,.05)}.teacher-card-head{display:flex;gap:10px;align-items:flex-start}.teacher-card-head .sp{flex:1}.teacher-card small{color:var(--muted)}.teacher-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.teacher-stats span{display:block;background:#faf9ff;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}.teacher-stats b{display:block;color:var(--ink);font-size:18px}.logs{margin-top:14px}.logs .li{font-size:13px}.logs .li small{color:var(--muted)}
@media (max-width:760px){.charts,.growth-grid{grid-template-columns:1fr}.admin-intro{align-items:flex-start;flex-direction:column;margin-bottom:14px}.admin-actions{width:100%}.admin-actions .btn{flex:1}.ttabs{overflow:auto;top:0}.ttabs button{white-space:nowrap}.section-head{align-items:stretch;flex-direction:column}.search-wrap{width:100%}.growth-toolbar{align-items:stretch;flex-direction:column}.teacher-table{display:none}.teacher-cards{display:grid;gap:10px}}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="/teacher"><i></i><span>KaleidoQuest</span></a><span class="tag" style="margin-left:6px"><svg class="ic" aria-hidden="true"><use href="/icons.svg#shield"></use></svg> Admin</span><span class="sp"></span><span class="muted" id="who"></span><button class="lang" type="button">EN</button><a class="btn ghost sm" href="/teacher" id="toDash"></a></div>
<div class="wrap">
  <header class="admin-intro"><div><span class="eyebrow">KaleidoQuest / Operations</span><h1 id="adminTitle"></h1><p id="adminSub"></p></div><div class="admin-actions"><button class="btn ghost sm" id="refreshAll"><svg class="ic" aria-hidden="true"><use href="/icons.svg#rotate-ccw"></use></svg> <span id="refreshLabel"></span></button><a class="btn main sm" href="/teacher" id="dashAction"></a></div></header>
  <div class="ttabs" role="tablist"><button data-v="ov" class="on" role="tab"></button><button data-v="growth" role="tab"></button><button data-v="tc" role="tab"></button><button data-v="sys" role="tab"></button></div>
  <section id="vov"></section>
  <section id="vgrowth" hidden></section>
  <section id="vtc" hidden><div class="section-head"><div><h2 id="teachersTitle"></h2><p id="teachersSub"></p></div><label class="search-wrap"><svg class="ic" aria-hidden="true"><use href="/icons.svg#search"></use></svg><input class="in" id="q"></label></div><div class="scroll teacher-table"><table id="tTable"></table></div><div class="teacher-cards" id="tCards"></div></section>
  <section id="vsys" hidden></section>
</div>
<div class="tip" id="tip" hidden></div>
<script src="/js/common.js?v=20261022b"></script>
<script>
const { t, tt, api, $, esc, toast, icon } = VA;
let me = null, OV = null, GR = null, TC = [], SYS = null, tab = 'ov';
const date = ms => ms ? new Date(ms).toLocaleString(VA.lang === 'en' ? 'en-SG' : 'zh-CN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
const ago = ms => { if (!ms) return tt('从未', 'never'); const m = (Date.now() - ms) / 6e4; return m < 60 ? tt(`${m | 0} 分钟前`, `${m | 0} min ago`) : m < 1440 ? tt(`${m / 60 | 0} 小时前`, `${m / 60 | 0} h ago`) : tt(`${m / 1440 | 0} 天前`, `${m / 1440 | 0} d ago`); };

function staticText() {
  const [a, g, b, c] = document.querySelectorAll('.ttabs button');
  a.innerHTML = icon('layout-dashboard') + ' ' + tt('总览', 'Overview'); g.innerHTML = icon('trending-up') + ' ' + tt('增长', 'Growth'); b.innerHTML = icon('users') + ' ' + tt('老师', 'Teachers'); c.innerHTML = icon('server') + ' ' + tt('系统', 'System');
  $('#adminTitle').textContent = tt('运营工作台', 'Operations dashboard');
  $('#adminSub').textContent = tt('用真实使用数据判断哪里值得继续投入。', 'Use real product signals to decide what to improve next.');
  $('#refreshLabel').textContent = tt('刷新数据', 'Refresh data');
  $('#dashAction').textContent = tt('回老师后台', 'Teacher dashboard');
  $('#toDash').textContent = tt('回老师后台', 'Teacher dashboard');
  $('#teachersTitle').textContent = tt('老师账号', 'Teacher accounts');
  $('#teachersSub').textContent = tt('点击一行查看题包、游戏和作业；搜索不会改变数据。', 'Open a teacher to inspect sets, games and homework. Search is read-only.');
  $('#q').placeholder = tt('搜索邮箱或名字', 'Search email or name');
}

// 单系列柱状图：一个颜色，柱顶圆角，悬停显示数字
function bars(days, key, label) {
  const W = 520, H = 170, L = 28, B = 22, bw = (W - L) / days.length;
  const max = Math.max(1, ...days.map(d => d[key]));
  const step = max <= 5 ? 1 : Math.ceil(max / 4);
  const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
  const y = v => (H - B) - (v / (ticks.at(-1) || 1)) * (H - B - 8);
  const g = ticks.map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const marks = days.map((d, i) => {
    const x = L + i * bw + 1, w = Math.max(2, bw - 2), top = y(d[key]), h = (H - B) - top;
    const r = Math.min(4, w / 2, h);
    const path = h <= 0 ? '' : `M${x},${H - B} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${H - B} Z`;
    return `<rect class="hit" x="${L + i * bw}" y="0" width="${bw}" height="${H - B}" data-tip="${esc(d.day.slice(5))} · ${label} ${d[key]}"/><path class="bar" d="${path}"/>`;
  }).join('');
  const xl = days.map((d, i) => i % 5 === 4 || i === days.length - 1 ? `<text class="ax" x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${d.day.slice(5)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><g class="grid">${g}</g>${marks}${xl}</svg>`;
}
document.addEventListener('mousemove', e => {
  const h = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (!h) { tip.hidden = true; return; }
  tip.hidden = false; tip.textContent = h.dataset.tip;
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
});

function renderOv() {
  const o = OV; if (!o) return;
  const T = o.totals;
  $('#vov').innerHTML = `<div class="tiles">
    <div class="card tile"><b>${T.teachers}</b><span>${tt('老师总数', 'Teachers')}</span><small>${tt(`本周新增 ${o.week.teachers}`, `+${o.week.teachers} this week`)}</small></div>
    <div class="card tile"><b>${T.activeWeek}</b><span>${tt('7 天内活跃老师', 'Active (7 days)')}</span></div>
    <div class="card tile"><b>${T.games}</b><span>${tt('累计开局', 'Games played')}</span><small>${tt(`本周 ${o.week.games} · 今天 ${o.today.games}`, `${o.week.games} this week · ${o.today.games} today`)}</small></div>
    <div class="card tile"><b>${T.participations}</b><span>${tt('累计学生人次', 'Student plays')}</span><small>${tt(`本周 ${o.week.students}`, `${o.week.students} this week`)}</small></div>
    <div class="card tile"><b>${T.sets}</b><span>${tt('题包', 'Question sets')}</span></div>
    <div class="card tile"><b>${T.assignments}</b><span>${tt('作业', 'Homework')}</span></div></div>
    <div class="charts">
      <div class="card chart"><h3>${tt('每天开局数', 'Games per day')}</h3><div class="sub">${tt('最近 30 天 · 课堂擂台和夺宝', 'Last 30 days · classic & treasure')}</div>${bars(o.days, 'games', tt('开局', 'games'))}</div>
      <div class="card chart"><h3>${tt('每天学生人次', 'Student plays per day')}</h3><div class="sub">${tt('最近 30 天 · 课堂参与 + 作业完成', 'Last 30 days · in class + homework')}</div>${bars(o.days, 'students', tt('人次', 'plays'))}</div>
    </div>
    <details class="tbl"><summary>${tt('查看每天的数字', 'Show daily numbers')}</summary><div class="scroll" style="margin-top:8px"><table><tr><th>${tt('日期', 'Date')}</th><th class="num">${tt('开局', 'Games')}</th><th class="num">${tt('学生人次', 'Student plays')}</th><th class="num">${tt('新老师', 'New teachers')}</th></tr>${[...o.days].reverse().map(d => `<tr><td>${d.day}</td><td class="num">${d.games}</td><td class="num">${d.students}</td><td class="num">${d.teachers}</td></tr>`).join('')}</table></div></details>`;
}

function renderTc() {
  const empty = `<div class="muted" style="text-align:center;padding:30px">${tt('没有找到', 'No match')}</div>`;
  $('#tTable').innerHTML = `<tr><th>${tt('老师', 'Teacher')}</th><th>${tt('注册', 'Joined')}</th><th>${tt('最后活跃', 'Last active')}</th><th class="num">${tt('题包', 'Sets')}</th><th class="num">${tt('开局', 'Games')}</th><th class="num">${tt('作业', 'HW')}</th><th>${tt('状态', 'Status')}</th></tr>` +
    (TC.length ? TC.map(x => `<tr class="click" data-id="${x.id}"><td><b>${esc(x.name)}</b><br><small class="muted">${esc(x.email)}</small></td><td>${date(x.created)}</td><td>${ago(x.last_seen)}</td><td class="num">${x.sets}</td><td class="num">${x.games}</td><td class="num">${x.assignments}</td><td>${x.admin ? `<span class="badge adm">${tt('管理员', 'Admin')}</span> ` : ''}${x.disabled ? `<span class="badge off">${tt('已停用', 'Disabled')}</span>` : `<span class="badge ok">${tt('正常', 'Active')}</span>`}</td></tr>`).join('') : `<tr><td colspan="7">${empty}</td></tr>`);
  $('#tCards').innerHTML = TC.length ? TC.map(x => `<article class="teacher-card click" data-id="${x.id}"><div class="teacher-card-head"><div><b>${esc(x.name)}</b><br><small>${esc(x.email)}</small></div><span class="sp"></span>${x.disabled ? `<span class="badge off">${tt('已停用', 'Disabled')}</span>` : `<span class="badge ok">${tt('正常', 'Active')}</span>`}</div><div class="teacher-stats"><span><b>${x.sets}</b>${tt('题包', 'Sets')}</span><span><b>${x.games}</b>${tt('开局', 'Games')}</span><span><b>${x.assignments}</b>${tt('作业', 'HW')}</span></div><small style="display:block;margin-top:10px">${tt('最后活跃', 'Last active')}：${ago(x.last_seen)}</small></article>`).join('') : empty;
}
function renderGrowth() {
  if (!GR) return;
  const c = GR.counts, rate = c.invited ? Math.round(c.activated / c.invited * 100) : 0;
  const totalChannels = GR.channels.reduce((n, c) => n + c.events, 0), channelOptions = ['direct', ...GR.channels.map(x => x.channel).filter(x => x !== 'direct')].filter((x, i, a) => a.indexOf(x) === i);
  $('#vgrowth').innerHTML = `<div class="growth-toolbar"><div><h2>${tt('增长与转化', 'Growth & conversion')}</h2><p>${tt('最近 30 天真实事件汇总。', 'Real event data from the last 30 days.')}</p></div><div class="growth-controls"><select class="in" id="growthDays"><option value="7">${tt('最近 7 天', 'Last 7 days')}</option><option value="30" selected>${tt('最近 30 天', 'Last 30 days')}</option><option value="90">${tt('最近 90 天', 'Last 90 days')}</option></select><select class="in" id="growthChannel"><option value="">${tt('全部渠道', 'All channels')}</option>${channelOptions.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="btn ghost sm" id="exportGrowth">${icon('download')} ${tt('导出 CSV', 'Export CSV')}</button></div></div><div class="tiles">
    <div class="card tile"><b>${c.share_opened || 0}</b><span>${tt('分享弹层打开', 'Share dialogs opened')}</span><small>${tt('最近 30 天', 'Last 30 days')}</small></div>
    <div class="card tile"><b>${(c.share_sent || 0) + (c.share_copied || 0) + (c.report_shared || 0) + (c.homework_shared || 0) + (c.referral_shared || 0) + (c.gallery_shared || 0)}</b><span>${tt('分享动作', 'Share actions')}</span></div>
    <div class="card tile"><b>${c.signup_completed || 0}</b><span>${tt('完成注册', 'Completed sign-ups')}</span></div>
    <div class="card tile"><b>${c.copy_started || 0}</b><span>${tt('开始复制游戏', 'Copy starts')}</span><small>${tt(`完成 ${c.copy_completed || 0} 次`, `${c.copy_completed || 0} completed`)}</small></div>
    <div class="card tile"><b>${c.onboarding_completed || 0}</b><span>${tt('完成新手引导', 'Onboarding completed')}</span><small>${c.onboarding_skipped || 0} ${tt('次跳过', 'skipped')}</small></div>
    <div class="card tile"><b>${c.invited || 0}</b><span>${tt('被推荐老师', 'Referred teachers')}</span></div>
    <div class="card tile"><b>${c.activated || 0}</b><span>${tt('推荐后首局', 'Referred first games')}</span><small>${rate}% ${tt('激活率', 'activation')}</small></div>
    <div class="card tile"><b>${c.referral_activated || 0}</b><span>${tt('奖励已发放', 'Rewards issued')}</span></div></div>
    <div class="card" style="margin-top:14px"><h3>${tt('最近 30 天增长漏斗', 'Growth funnel · last 30 days')}</h3><div class="scroll" style="margin-top:8px"><table><tr><th>${tt('日期', 'Date')}</th><th class="num">${tt('页面', 'Pages')}</th><th class="num">${tt('分享', 'Shares')}</th><th class="num">${tt('注册', 'Sign-ups')}</th><th class="num">${tt('开局', 'Games')}</th><th class="num">${tt('推荐首局', 'Referral activations')}</th></tr>${[...GR.days].reverse().map(d => `<tr><td>${d.day}</td><td class="num">${d.page}</td><td class="num">${d.shares}</td><td class="num">${d.signups}</td><td class="num">${d.games}</td><td class="num">${d.activated}</td></tr>`).join('')}</table></div></div>
    <div class="growth-grid">
      <div class="card growth-panel"><h3>${tt('邀请排行榜', 'Referral leaderboard')}</h3><p class="sub">${tt('按真实注册归因统计；仅管理员可见。', 'Based on attributed sign-ups; admin-only.')}</p><div class="scroll"><table><tr><th>#</th><th>${tt('老师', 'Teacher')}</th><th class="num">${tt('邀请', 'Invited')}</th><th class="num">${tt('首局', 'Activated')}</th><th class="num">${tt('激活率', 'Rate')}</th></tr>${GR.leaderboard.length ? GR.leaderboard.map((x, i) => `<tr><td>${i + 1}</td><td><b>${esc(x.name)}</b></td><td class="num">${x.invited}</td><td class="num">${x.activated}</td><td class="num">${x.invited ? Math.round(x.activated / x.invited * 100) : 0}%</td></tr>`).join('') : `<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">${tt('还没有推荐数据', 'No referral data yet')}</td></tr>`}</table></div></div>
      <div class="card growth-panel"><h3>${tt('分享渠道', 'Share channels')}</h3><p class="sub">${tt('最近 30 天事件来源；未标记的归为 direct。', 'Last 30 days; untagged events are direct.')}</p><div class="scroll"><table><tr><th>${tt('渠道', 'Channel')}</th><th class="num">${tt('事件', 'Events')}</th><th class="num">${tt('占比', 'Share')}</th></tr>${GR.channels.length ? GR.channels.map(x => `<tr><td><b>${esc(x.channel)}</b></td><td class="num">${x.events}</td><td class="num">${totalChannels ? Math.round(x.events / totalChannels * 100) : 0}%</td></tr>`).join('') : `<tr><td colspan="3" class="muted" style="text-align:center;padding:24px">${tt('还没有渠道数据', 'No channel data yet')}</td></tr>`}</table></div></div>
    </div>`;
  $('#exportGrowth').onclick = () => { const days = $('#growthDays').value, channel = $('#growthChannel').value; location.href = `/api/admin/growth.csv?days=${days}${channel ? '&channel=' + encodeURIComponent(channel) : ''}`; };
}
let qTimer = 0;
$('#q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(async () => { TC = await api('/api/admin/teachers?q=' + encodeURIComponent($('#q').value)); renderTc(); }, 250); };
const openTeacherFromList = e => { const r = e.target.closest('[data-id]'); if (r) openTeacher(+r.dataset.id); };
$('#tTable').onclick = openTeacherFromList;
$('#tCards').onclick = openTeacherFromList;

async function openTeacher(id) {
  const d = await api('/api/admin/teachers/' + id);
  document.querySelector('.drawer')?.remove();
  const el = document.createElement('div'); el.className = 'drawer';
  const self = d.id === me.id;
  el.innerHTML = `<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:center"><h2>${esc(d.name)}</h2><button class="btn ghost sm" data-x aria-label="${tt('关闭', 'Close')}">${icon('x')}</button></div>
    <div class="muted">${esc(d.email)} · ${tt('注册', 'Joined')} ${date(d.created)} · ${tt('最后活跃', 'Last active')} ${ago(d.last_seen)}</div>
    <div class="acts">${d.disabled ? '' : `<button class="btn ghost sm" data-a="reset">${icon('mail')} ${tt('发重设密码邮件', 'Send reset email')}</button>`}
      ${self ? `<span class="muted" style="font-size:13px">${tt('（这是你自己的账号）', '(your own account)')}</span>` : `<button class="btn ghost sm" data-a="disable">${d.disabled ? icon('check') + ' ' + tt('重新启用', 'Enable') : icon('ban') + ' ' + tt('停用账号', 'Disable')}</button><button class="btn ghost sm danger" data-a="del">${icon('trash-2')} ${tt('删除账号和全部内容', 'Delete account & content')}</button>`}</div>
    <div class="user-edit"><h3>${icon('pencil')} ${tt('编辑用户', 'Edit user')}</h3><div class="row"><label class="field"><span>${tt('姓名', 'Name')}</span><input class="in" id="editName" value="${esc(d.name)}" maxlength="40"></label><label class="field"><span>${tt('邮箱', 'Email')}</span><input class="in" id="editEmail" type="email" value="${esc(d.email)}" maxlength="190"></label><button class="btn main sm" data-a="save">${tt('保存资料', 'Save profile')}</button></div>${self ? '' : `<div class="row"><label class="field"><span>${tt('直接设定新密码（至少 8 位）', 'Set a new password directly (8+ chars)')}</span><input class="in" id="editPassword" type="password" minlength="8" autocomplete="new-password"></label><button class="btn ghost sm" data-a="password">${icon('key-round')} ${tt('重设密码', 'Reset password')}</button></div>`}</div>
    <h3>${icon('book-open')} ${tt('题包', 'Question sets')}（${d.sets.length}）</h3>${d.sets.map(s => `<div class="li">${VA.subjectIcon(s.subject)}<b>${esc(s.title)}</b><span class="muted">${s.n} ${t('questions')}</span><span class="sp"></span><button class="btn ghost sm" data-set="${s.id}">${tt('查看题目', 'View')}</button></div>`).join('') || `<div class="muted">–</div>`}
    <h3>${icon('gamepad-2')} ${tt('游戏', 'Games')}（${d.games.length}）</h3>${d.games.map(g => `<div class="li">${icon(g.mode === 'treasure' ? 'gem' : 'swords')}<b>${esc(g.title)}</b><span class="muted">${g.players} ${t('players')} · ${date(g.ended)}</span><span class="sp"></span><a class="btn ghost sm" href="/report?admin=1&id=${g.id}" target="_blank">${tt('报告', 'Report')}</a></div>`).join('') || `<div class="muted">–</div>`}
    <h3>${icon('clipboard-list')} ${tt('作业', 'Homework')}（${d.assignments.length}）</h3>${d.assignments.map(a => `<div class="li">${icon('clipboard-list')}<b>${esc(a.title)}</b><span class="muted">${tt(`${a.done} 人完成`, `${a.done} done`)} · ${tt('截止', 'Due')} ${date(a.due)}${a.closed ? ' · ' + tt('已关闭', 'closed') : ''}</span></div>`).join('') || `<div class="muted">–</div>`}
    <div id="setView"></div></div>`;
  el.onclick = async e => {
    if (e.target === el || e.target.closest('[data-x]')) return el.remove();
    const s = e.target.closest('[data-set]');
    if (s) {
      const set = await api('/api/admin/sets/' + s.dataset.set);
      const TY = { mcq: tt('选择', 'MCQ'), tf: tt('判断', 'T/F'), input: tt('填空', 'Type'), order: tt('排序', 'Order') };
      el.querySelector('#setView').innerHTML = `<h3>${icon('search')} ${esc(set.title)}</h3>` + set.questions.map((q, i) => `<div class="qv"><b>${i + 1}. ${esc(q.prompt || q.speak)}</b> <small>${TY[q.type]} · ${q.time}s</small><br><small>${q.type === 'mcq' ? q.options.map((o, k) => q.answer.includes(k) ? `<b>${icon('check')} ${esc(o)}</b>` : esc(o)).join(' · ') : q.type === 'tf' ? icon(q.answer ? 'check' : 'x') : q.type === 'input' ? q.answer.map(esc).join(' | ') : q.options.map(esc).join(' → ')}</small></div>`).join('');
      el.querySelector('#setView').scrollIntoView({ behavior: 'smooth' });
      return;
    }
    const b = e.target.closest('[data-a]'); if (!b) return;
    try {
      if (b.dataset.a === 'reset') { await api(`/api/admin/teachers/${id}/reset`, { method: 'POST' }); toast(tt('已发送重设密码邮件', 'Reset email sent')); }
      if (b.dataset.a === 'save') {
        const updated = await api(`/api/admin/teachers/${id}`, { method: 'PATCH', body: { name: el.querySelector('#editName').value, email: el.querySelector('#editEmail').value } });
        await refreshTc(); openTeacher(id); toast(tt('用户资料已保存', 'User profile saved')); return;
      }
      if (b.dataset.a === 'password') {
        const password = el.querySelector('#editPassword').value;
        await api(`/api/admin/teachers/${id}/password`, { method: 'POST', body: { password } });
        toast(tt('密码已重设，旧登录已失效', 'Password reset; old sessions are signed out')); el.remove(); return;
      }
      if (b.dataset.a === 'disable') { await api(`/api/admin/teachers/${id}/disable`, { method: 'POST', body: { disabled: !d.disabled } }); await refreshTc(); openTeacher(id); }
      if (b.dataset.a === 'del') {
        if (!b.dataset.armed) { b.dataset.armed = 1; b.innerHTML = icon('triangle-alert') + ' ' + tt('再点一次：永久删除，无法恢复', 'Click again — permanent'); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.innerHTML = icon('trash-2') + ' ' + tt('删除账号和全部内容', 'Delete account & content'); } }, 3500); return; }
        await api(`/api/admin/teachers/${id}`, { method: 'DELETE' }); el.remove(); await refreshTc(); toast(tt('已删除', 'Deleted'));
      }
    } catch (x) { toast(({ email: tt('邮箱格式不对', 'Invalid email'), name: tt('请填写姓名', 'Name is required'), exists: tt('这个邮箱已被使用', 'Email already in use'), password: tt('密码至少 8 位', 'Password must be 8+ characters'), self_admin: tt('不能把自己的管理员邮箱改成非管理员邮箱', 'You cannot remove your own admin access'), mail_failed: tt('邮件发送失败', 'Email failed') }[x.message]) || t('err_generic')); }
  };
  document.body.appendChild(el);
}
async function refreshTc() { TC = await api('/api/admin/teachers?q=' + encodeURIComponent($('#q').value)); renderTc(); }
async function loadGrowth() { GR = await api('/api/admin/growth'); renderGrowth(); }

function renderSys() {
  const s = SYS; if (!s) return;
  const up = s.uptime > 86400 ? tt(`${s.uptime / 86400 | 0} 天`, `${s.uptime / 86400 | 0} d`) : tt(`${s.uptime / 3600 | 0} 小时`, `${s.uptime / 3600 | 0} h`);
  $('#vsys').innerHTML = `<div class="tiles">
    <div class="card tile"><b>${s.live}</b><span>${tt('进行中的房间', 'Live rooms')}</span></div>
    <div class="card tile"><b>${s.online}</b><span>${tt('在线学生', 'Students online')}</span></div>
    <div class="card tile"><b>${s.memory} MB</b><span>${tt('内存', 'Memory')}</span></div>
    <div class="card tile"><b>${up}</b><span>${tt('已运行', 'Uptime')}</span><small>Node ${esc(s.node)}</small></div>
    <div class="card tile"><b>${(s.dbSize / 1024).toFixed(0)} KB</b><span>${tt('数据库', 'Database')}</span></div>
    <div class="card tile"><b>${s.backup ? ago(s.backup.at) : '–'}</b><span>${tt('最近备份', 'Last backup')}</span><small>${s.backup ? tt(`共 ${s.backup.count} 份 · 保留 14 天`, `${s.backup.count} kept · 14 days`) : tt('还没有备份', 'No backups yet')}</small></div>
    <div class="card tile"><b>${icon(s.mail ? 'check' : 'triangle-alert', 'lg')}</b><span>${tt('找回密码邮件', 'Reset emails')}</span><small>${s.mail ? tt('已配置', 'Configured') : tt('未配置 SMTP', 'SMTP not set')}</small></div></div>
    <button class="btn ghost sm" id="sysRefresh">${icon('rotate-ccw')} ${tt('刷新', 'Refresh')}</button>
    <div class="card logs"><h3>${icon('history')} ${tt('最近管理员操作', 'Recent admin actions')}</h3>${(s.logs || []).length ? s.logs.map(l => `<div class="li"><b>${esc(l.action)}</b><span class="sp"></span><small>${esc(l.target_name || '—')} · ${date(l.created)}</small></div>`).join('') : `<p class="muted" style="margin-top:8px">${tt('还没有操作记录', 'No admin actions yet')}</p>`}</div>`;
  $('#sysRefresh').onclick = loadSys;
}
async function loadSys() { SYS = await api('/api/admin/system'); renderSys(); }
async function refreshAll() {
  const b = $('#refreshAll'); b.disabled = true;
  try {
    [OV, TC, GR, SYS] = await Promise.all([api('/api/admin/overview'), api('/api/admin/teachers'), api('/api/admin/growth'), api('/api/admin/system')]);
    renderOv(); renderTc(); renderGrowth(); renderSys(); toast(tt('数据已刷新', 'Data refreshed'));
  } catch (e) { toast(tt('刷新失败，请稍后再试', 'Refresh failed — try again'));
  } finally { b.disabled = false; }
}
$('#refreshAll').onclick = refreshAll;

document.querySelectorAll('.ttabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.v; document.querySelectorAll('.ttabs button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
  ['ov', 'growth', 'tc', 'sys'].forEach(v => $('#v' + v).hidden = v !== tab);
  if (tab === 'growth') loadGrowth();
  if (tab === 'sys') loadSys();
});
document.addEventListener('langchange', () => { staticText(); renderOv(); renderGrowth(); renderTc(); renderSys(); });
(async () => {
  try { me = await api('/api/me'); } catch (e) { location.href = '/'; return; }
  if (!me.isAdmin) { document.querySelector('.wrap').innerHTML = `<div class="card" style="text-align:center;padding:40px">${tt('这个账号没有管理员权限。', 'This account is not an admin.')}</div>`; return; }
  $('#who').textContent = me.name; staticText();
  [OV, TC] = await Promise.all([api('/api/admin/overview'), api('/api/admin/teachers')]);
  renderOv(); renderTc();
})();
</script>
</body>
</html>
