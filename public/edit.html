<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaleidoQuest · 编辑题包</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=20261022a">
<style>
.meta{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;margin-top:18px;align-items:start}
.qlist{display:flex;flex-direction:column;gap:12px}
.qc{padding:16px}
.qc.bad{border-color:var(--bad);box-shadow:0 0 0 2px rgba(220,38,38,.15)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qh b{font-size:15px;min-width:34px}
.qh select{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-weight:700;font-size:13px}
.qh .sp{flex:1}
.qh .ib{border:0;background:#f3f0ff;border-radius:8px;width:30px;height:30px;cursor:pointer;display:inline-grid;place-items:center;color:var(--ink)}
.qh .ib:hover{background:#e9e3ff;color:var(--brand2)}
.qc textarea{width:100%;min-height:54px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;resize:vertical;font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:6px;border-radius:10px;padding:4px 6px 4px 4px;color:#fff}
.opt .shape{font-size:16px}
.opt input[type=text]{flex:1;min-width:0;border:0;border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
.opt label{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.opt label input{width:18px;height:18px;accent-color:#fff}
.opt .x{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer}
.tfrow{display:flex;gap:10px;margin-top:10px}
.tfrow button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:18px;cursor:pointer}
.tfrow button.on{color:#fff;border-color:transparent}
.tfrow button.on.t{background:var(--c1)}.tfrow button.on.f{background:var(--c3)}
.more{margin-top:10px;font-size:13px}
.more summary{cursor:pointer;color:var(--muted);font-weight:700}
.more .row{margin-top:8px}
.qerr{color:var(--bad);font-size:13px;font-weight:700;margin-top:8px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px;border:2px dashed var(--line);border-radius:var(--r);justify-content:center}
.side{position:sticky;top:80px}
.ptabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ptabs button{border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;background:#f3f0ff;cursor:pointer}
.ptabs button.on{background:var(--brand2);color:#fff}
.pbody{display:flex;flex-direction:column;gap:10px;font-size:14px}
.pbody textarea{min-height:110px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:600}
.checks .ic{color:var(--brand2)}
.opsym{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:#f3f0ff;color:var(--brand2);font-family:"Fredoka",sans-serif;font-size:13px}
.savebar{position:sticky;bottom:0;background:rgba(245,243,255,.92);backdrop-filter:blur(6px);padding:12px 0;display:flex;gap:10px;align-items:center;margin-top:16px}
.savebar .sp{flex:1}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.meta{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="/teacher"><i></i><span>KaleidoQuest</span></a><span class="sp"></span><button class="lang" type="button">EN</button><a class="btn ghost sm" href="/teacher" data-i="back"></a></div>
<div class="wrap">
  <div class="card meta">
    <label class="field"><span id="lTitle"></span><input id="title" maxlength="80"></label>
    <label class="field"><span id="lSubject"></span><select id="subject"></select></label>
    <label class="field"><span id="lGrade"></span><input id="grade" maxlength="30"></label>
    <button class="btn main" id="saveTop"></button>
  </div>
  <div class="layout">
    <div>
      <div class="qlist" id="qlist"></div>
      <div class="addbar" id="addbar" style="margin-top:12px"></div>
    </div>
    <aside class="card side">
      <h3 style="margin-bottom:10px" id="lQuick"></h3>
      <div class="ptabs" id="ptabs"></div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
  <div class="savebar"><span class="muted" id="count"></span><span class="sp"></span><span class="err" id="saveErr"></span><a class="btn go" id="playBtn" hidden></a><button class="btn main" id="saveBtn"></button></div>
</div>
<script src="/js/common.js?v=20261022b"></script>
<script src="/js/plugins/ai.js?v=20261021e"></script>
<script src="/js/plugins/chinese.js"></script>
<script src="/js/plugins/math.js"></script>
<script src="/js/plugins/import.js"></script>
<script src="/js/edit.js?v=20261021d"></script>
</body>
</html>
